<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>متن الآجرومية — Pembelajaran Nahwu Interaktif</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Zilla+Slab:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EFE3C6;
  --paper-light:#FBF5E6;
  --paper-deep:#E4D5AF;
  --ink:#2A2015;
  --ink-soft:#5B4B34;
  --gold:#A6772A;
  --gold-light:#C99A3F;
  --green:#3C5B47;
  --green-dark:#22352A;
  --rose:#8B3A3A;
  --line:rgba(42,32,21,0.18);
  --font-ar:'Amiri',serif;
  --font-head:'Zilla Slab',serif;
  --font-body:'Lora',serif;
  --font-mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  background-image:
    radial-gradient(circle at 1px 1px, rgba(42,32,21,0.06) 1px, transparent 0);
  background-size:22px 22px;
  color:var(--ink);
  font-family:var(--font-body);
  line-height:1.65;
  min-height:100vh;
}
::selection{background:var(--gold-light);color:var(--green-dark);}

/* ---------- Header ---------- */
.kitab-header{
  text-align:center;
  padding:38px 20px 22px;
  border-bottom:3px double var(--gold);
  background:linear-gradient(180deg, rgba(255,255,255,0.25), transparent);
  position:relative;
}
.kitab-header .eyebrow{
  font-family:var(--font-mono);
  font-size:11px;
  letter-spacing:0.28em;
  text-transform:uppercase;
  color:var(--green-dark);
  opacity:0.75;
}
.kitab-header h1{
  font-family:var(--font-ar);
  font-size:clamp(34px,6vw,58px);
  margin:8px 0 4px;
  color:var(--green-dark);
  font-weight:700;
}
.kitab-header h2{
  font-family:var(--font-head);
  font-weight:600;
  font-size:clamp(15px,2.4vw,20px);
  margin:0;
  color:var(--ink-soft);
  letter-spacing:0.01em;
}
.ornament{
  width:180px;height:14px;margin:14px auto 0;
  background:
    linear-gradient(90deg, transparent 0%, var(--gold) 45%, var(--gold) 55%, transparent 100%);
  clip-path:polygon(0 50%,10% 0,20% 50%,30% 0,40% 50%,50% 0,60% 50%,70% 0,80% 50%,90% 0,100% 50%,90% 100%,80% 50%,70% 100%,60% 50%,50% 100%,40% 50%,30% 100%,20% 50%,10% 100%);
  opacity:0.7;
}
.corner-mark{
  position:absolute;
  top:14px;
  font-family:var(--font-ar);
  font-size:18px;
  color:var(--gold);
  opacity:0.55;
}
.corner-mark.left{left:24px;}
.corner-mark.right{right:24px;}

/* ---------- Layout ---------- */
.wrap{
  display:grid;
  grid-template-columns:270px 1fr;
  max-width:1180px;
  margin:0 auto;
  gap:0;
}
.toc{
  border-right:1px solid var(--line);
  padding:26px 14px 60px;
  position:sticky;
  top:0;
  align-self:start;
  max-height:100vh;
  overflow-y:auto;
}
.toc-title{
  font-family:var(--font-mono);
  font-size:11px;
  letter-spacing:0.18em;
  text-transform:uppercase;
  color:var(--ink-soft);
  padding:0 10px 10px;
  border-bottom:1px solid var(--line);
  margin-bottom:8px;
}
.toc-section-label{
  font-family:var(--font-mono);
  font-size:10px;
  letter-spacing:0.16em;
  text-transform:uppercase;
  color:var(--gold);
  padding:14px 10px 4px;
  opacity:0.85;
}
.toc-item{
  display:flex;
  align-items:baseline;
  gap:10px;
  width:100%;
  text-align:left;
  background:none;
  border:none;
  cursor:pointer;
  padding:10px 10px;
  border-radius:4px;
  color:var(--ink-soft);
  font-family:var(--font-body);
  font-size:14.5px;
  transition:background .15s ease, color .15s ease;
}
.toc-item .num{
  font-family:var(--font-ar);
  font-size:17px;
  color:var(--gold);
  width:20px;
  flex-shrink:0;
  text-align:center;
}
.toc-item:hover{background:rgba(166,119,42,0.1);}
.toc-item.active{
  background:var(--green-dark);
  color:var(--paper-light);
}
.toc-item.active .num{color:var(--gold-light);}
.toc-progress{
  margin-top:16px;
  padding:0 10px;
  font-family:var(--font-mono);
  font-size:11px;
  color:var(--ink-soft);
  opacity:0.7;
}

.toc-mobile-toggle{display:none;}

main{padding:34px 46px 90px;min-width:0;}
.page{
  background:var(--paper-light);
  border:1px solid var(--line);
  border-radius:2px;
  padding:38px 44px;
  box-shadow:0 1px 0 rgba(42,32,21,0.05), 0 12px 30px -18px rgba(42,32,21,0.35);
  position:relative;
  animation:pageIn .35s ease;
}
.page::before{
  content:"";
  position:absolute;inset:8px;
  border:1px solid rgba(166,119,42,0.35);
  pointer-events:none;
}
@keyframes pageIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

.bab-eyebrow{
  font-family:var(--font-mono);
  font-size:11px;
  letter-spacing:0.22em;
  text-transform:uppercase;
  color:var(--gold);
}
.bab-title-row{
  display:flex;
  align-items:baseline;
  gap:18px;
  margin:6px 0 4px;
  flex-wrap:wrap;
}
.bab-num-big{
  font-family:var(--font-ar);
  font-size:52px;
  color:var(--gold);
  line-height:1;
}
h2.bab-title{
  font-family:var(--font-head);
  font-size:clamp(22px,3.2vw,30px);
  margin:0;
  color:var(--green-dark);
  font-weight:700;
}
.bab-arabic-title{
  font-family:var(--font-ar);
  font-size:26px;
  color:var(--ink-soft);
  margin:2px 0 22px;
}
.divider{
  border:none;height:1px;
  background:linear-gradient(90deg,var(--gold),transparent 70%);
  margin:22px 0;
}
.page p{margin:0 0 14px;font-size:15.5px;}
.page ul,.page ol{margin:0 0 16px;padding-left:22px;font-size:15.5px;}
.page li{margin-bottom:7px;}
.arabic{font-family:var(--font-ar);direction:rtl;}
.arabic-inline{
  font-family:var(--font-ar);
  font-size:20px;
  direction:rtl;
  color:var(--green-dark);
}

.note-box{
  background:rgba(60,91,71,0.08);
  border-left:3px solid var(--green);
  padding:14px 18px;
  border-radius:2px;
  margin:18px 0;
  font-size:14.5px;
}
.note-box b{color:var(--green-dark);}

table.irab-table{
  width:100%;
  border-collapse:collapse;
  margin:16px 0 22px;
  font-size:14px;
}
table.irab-table th, table.irab-table td{
  border:1px solid var(--line);
  padding:9px 12px;
  text-align:left;
}
table.irab-table th{
  background:var(--green-dark);
  color:var(--paper-light);
  font-family:var(--font-mono);
  font-size:11.5px;
  letter-spacing:0.05em;
  text-transform:uppercase;
}
table.irab-table td.ar{font-family:var(--font-ar);font-size:18px;direction:rtl;color:var(--green-dark);}
table.irab-table tr:nth-child(even) td{background:rgba(166,119,42,0.05);}

/* ---------- Teks Asli Matan ---------- */
.matan-box{
  background:var(--green-dark);
  color:var(--paper-light);
  border-radius:3px;
  padding:22px 24px;
  margin:20px 0 26px;
  position:relative;
}
.matan-box .matan-label{
  font-family:var(--font-mono);
  font-size:10.5px;
  letter-spacing:0.18em;
  text-transform:uppercase;
  color:var(--gold-light);
  margin-bottom:14px;
}
.matan-line{
  margin-bottom:14px;
  padding-bottom:14px;
  border-bottom:1px solid rgba(251,245,230,0.14);
}
.matan-line:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
.matan-line .matan-ar{
  font-family:var(--font-ar);
  font-size:22px;
  direction:rtl;
  line-height:1.9;
  color:var(--paper-light);
  margin-bottom:6px;
}
.matan-line .matan-id{
  font-family:var(--font-body);
  font-style:italic;
  font-size:13.5px;
  color:var(--gold-light);
  opacity:0.92;
}
.matan-note{
  background:rgba(166,119,42,0.12);
  border-left:3px solid var(--gold);
  padding:12px 16px;
  font-size:13px;
  color:var(--ink-soft);
  margin:16px 0 24px;
  border-radius:2px;
}

/* ---------- Papan I'rab (signature interactive) ---------- */
.parser-block{
  margin:24px 0 30px;
  border:1px solid var(--line);
  background:var(--paper-deep);
  border-radius:3px;
  padding:20px 22px 22px;
}
.parser-label-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:12px;
}
.parser-label{
  font-family:var(--font-mono);
  font-size:11px;
  letter-spacing:0.16em;
  text-transform:uppercase;
  color:var(--green-dark);
  opacity:0.8;
}
.example-tabs{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}
.example-tab{
  font-family:var(--font-mono);
  font-size:10.5px;
  letter-spacing:0.03em;
  text-transform:uppercase;
  background:var(--paper-light);
  border:1px solid var(--line);
  border-radius:20px;
  padding:5px 12px;
  cursor:pointer;
  color:var(--ink-soft);
  transition:background .15s, color .15s;
}
.example-tab:hover{background:rgba(166,119,42,0.15);}
.example-tab.active{background:var(--gold);color:var(--paper-light);border-color:var(--gold);}
.parser-sentence{
  display:flex;
  flex-wrap:wrap-reverse;
  gap:8px;
  direction:rtl;
  justify-content:flex-end;
}
.parser-word{
  cursor:pointer;
  background:var(--paper-light);
  border:1px solid var(--line);
  border-radius:3px;
  padding:8px 14px;
  font-family:var(--font-ar);
  font-size:24px;
  color:var(--green-dark);
  transition:background .15s ease, border-color .15s, transform .1s ease;
  position:relative;
}
.parser-word:hover{border-color:var(--gold);transform:translateY(-2px);}
.parser-word.open{background:var(--gold);color:var(--paper-light);border-color:var(--gold);}
.parser-detail{
  direction:ltr;
  width:100%;
  background:var(--green-dark);
  color:var(--paper-light);
  border-radius:3px;
  padding:14px 18px;
  font-family:var(--font-body);
  font-size:13.5px;
  margin-top:2px;
  animation:detailIn .18s ease;
}
@keyframes detailIn{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:translateY(0);}}
.parser-detail .role{
  font-family:var(--font-mono);
  font-size:11px;
  letter-spacing:0.1em;
  text-transform:uppercase;
  color:var(--gold-light);
  margin-bottom:4px;
}
.hint-tap{font-size:11.5px;color:var(--ink-soft);opacity:0.7;margin-top:10px;font-family:var(--font-mono);}

/* ---------- Quiz ---------- */
.quiz-block{
  margin-top:30px;
  border-top:2px dashed var(--line);
  padding-top:20px;
}
.quiz-block h3{
  font-family:var(--font-head);
  font-size:16px;
  color:var(--green-dark);
  margin:0 0 4px;
}
.quiz-sub{font-size:12.5px;color:var(--ink-soft);opacity:0.75;margin-bottom:16px;font-family:var(--font-mono);}
.q-item{
  background:var(--paper-light);
  border:1px solid var(--line);
  border-radius:3px;
  padding:16px 18px;
  margin-bottom:14px;
}
.q-item .q-text{font-size:14.5px;font-weight:600;color:var(--ink);margin-bottom:10px;}
.q-item .q-arabic{font-family:var(--font-ar);font-size:19px;direction:rtl;color:var(--green-dark);margin-bottom:10px;}
.q-opts{display:grid;gap:8px;}
.q-opt{
  text-align:left;
  cursor:pointer;
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:3px;
  padding:9px 12px;
  font-family:var(--font-body);
  font-size:13.5px;
  color:var(--ink);
  transition:background .15s;
}
.q-opt:hover{background:rgba(166,119,42,0.14);}
.q-opt.correct{background:var(--green);color:var(--paper-light);border-color:var(--green);}
.q-opt.wrong{background:var(--rose);color:var(--paper-light);border-color:var(--rose);}
.q-opt[disabled]{cursor:default;}
.q-explain{
  margin-top:10px;
  font-size:13px;
  color:var(--ink-soft);
  background:rgba(60,91,71,0.08);
  border-left:3px solid var(--green);
  padding:9px 12px;
  display:none;
}
.q-explain.show{display:block;}

/* nav */
.page-nav{
  display:flex;
  justify-content:space-between;
  margin-top:32px;
}
.nav-btn{
  font-family:var(--font-mono);
  font-size:12.5px;
  letter-spacing:0.05em;
  text-transform:uppercase;
  background:var(--green-dark);
  color:var(--paper-light);
  border:none;
  padding:11px 18px;
  border-radius:3px;
  cursor:pointer;
  transition:opacity .15s;
}
.nav-btn:hover{opacity:0.85;}
.nav-btn[disabled]{opacity:0.25;cursor:not-allowed;}

/* final exam */
.score-badge{
  display:inline-block;
  font-family:var(--font-mono);
  font-size:13px;
  padding:6px 14px;
  border-radius:20px;
  background:var(--gold);
  color:var(--paper-light);
  margin-bottom:16px;
}

.site-footer{
  text-align:center;
  padding:24px 20px 32px;
  border-top:1px solid var(--line);
  font-family:var(--font-mono);
  font-size:11.5px;
  color:var(--ink-soft);
  opacity:0.75;
  letter-spacing:0.02em;
}
.site-footer a{color:var(--green-dark);text-decoration:none;border-bottom:1px dotted var(--green-dark);}

@media (max-width:860px){
  .wrap{grid-template-columns:1fr;}
  .toc{
    position:static;
    max-height:none;
    border-right:none;
    border-bottom:1px solid var(--line);
    display:flex;
    flex-direction:column;
    padding:16px 14px;
  }
  .toc.collapsed .toc-list{display:none;}
  .toc-mobile-toggle{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:var(--green-dark);
    color:var(--paper-light);
    border:none;
    border-radius:4px;
    padding:12px 14px;
    font-family:var(--font-mono);
    font-size:12px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    cursor:pointer;
    margin-bottom:10px;
  }
  main{padding:22px 16px 60px;}
  .page{padding:24px 18px;}
  .bab-num-big{font-size:38px;}
  .corner-mark{display:none;}
}
</style>
</head>
<body>

<header class="kitab-header">
  <span class="corner-mark left">﴾</span>
  <div class="eyebrow">Pembelajaran Interaktif · Nahwu Dasar hingga Lanjutan</div>
  <h1>متن الآجرومية</h1>
  <h2>Matan Al-Ajurumiyah — Karya Imam Ash-Shanhaji</h2>
  <div class="ornament"></div>
  <span class="corner-mark right">﴿</span>
</header>

<div class="wrap">
  <nav class="toc" id="toc">
    <button class="toc-mobile-toggle" id="tocToggle">
      <span>Daftar Bab</span><span id="tocToggleIcon">▾</span>
    </button>
    <div class="toc-title">Daftar Isi</div>
    <div class="toc-list" id="tocList"></div>
    <div class="toc-progress" id="tocProgress"></div>
  </nav>

  <main>
    <div class="page" id="pageContent"></div>
  </main>
</div>

<footer class="site-footer">
  &copy; 2026 by Achmad Fauzi &middot; Email: <a href="mailto:vaozeei@gmail.com">vaozeei@gmail.com</a>
</footer>

  content:`
  <p><span class="arabic-inline">الْكَلاَمُ هُوَ اللَّفْظُ الْمُرَكَّبُ الْمُفِيدُ بِالْوَضْعِ</span></p>
  <p><b>Kalam</b> adalah lafazh (ucapan bersuara) yang tersusun dan memberi faedah (makna yang sempurna), disusun berdasarkan kaidah bahasa Arab. Sebuah ucapan baru disebut <i>kalam</i> jika memenuhi empat syarat sekaligus:</p>
  <ul>

{
  id:'kalimat', arNum:'٢', section:'dasar', title:"Pembagian Kalimat: Isim, Fi'il, Huruf", arTitle:'أقسام الكلمة',
  content:`
  <p>Kalimat (satuan kata) dalam bahasa Arab terbagi menjadi tiga jenis: <b>Isim</b> (kata benda), <b>Fi'il</b> (kata kerja), dan <b>Huruf</b> (kata tugas/partikel). Ketiganya dapat dibedakan lewat ciri-ciri berikut.</p>
  <table class="irab-table">

  </table>
  <div class="note-box"><b>Catatan:</b> Isim dan fi'il termasuk kata yang punya makna mandiri, sedangkan huruf baru bermakna jika dirangkai dengan kata lain.</div>

{
  id:'irab-bina', arNum:'٣', section:'dasar', title:"I'rab dan Bina", arTitle:'الإعراب والبناء',
  content:`
  <p><b>I'rab</b> adalah perubahan keadaan akhir kata karena perbedaan 'amil (faktor tata bahasa) yang memasukinya — baik secara lafzhi (tampak jelas pada harakat/huruf) maupun taqdiri (diperkirakan, tersembunyi).</p>
  <p><b>Bina</b> adalah kondisi kata yang akhirannya tetap sama walaupun 'amil yang masuk berbeda-beda.</p>
  <ul>
    <li>Isim pada dasarnya bersifat <b>mu'rab</b> (berubah-ubah akhirnya), kecuali sebagian kecil seperti isim dhamir dan isim isyarah yang mabni.</li>
    <li>Fi'il mudhari' bersifat <b>mu'rab</b>, kecuali bersambung dengan nun taukid atau nun niswah.</li>
    <li>Fi'il madhi, fi'il amr, dan seluruh huruf bersifat <b>mabni</b> (tetap).</li>
  </ul>
  <div class="note-box"><b>Contoh:</b> kata <span class="arabic-inline">مُحَمَّدٌ</span> berubah akhirnya menjadi <span class="arabic-inline">مُحَمَّدًا</span> atau <span class="arabic-inline">مُحَمَّدٍ</span> tergantung kedudukannya dalam kalimat — inilah i'rab. Sedangkan kata <span class="arabic-inline">هٰذَا</span> (isim isyarah) tidak pernah berubah — inilah bina.</div>

  ],
  examples:[

    {q:"Manakah yang bersifat mabni (tetap)?", ar:"", opts:["Fi'il Mudhari' tanpa nun taukid","Isim pada umumnya","Fi'il Madhi","Fi'il Mudhari' bersambung wawu jamak"], answer:2, explain:"Fi'il madhi, fi'il amr, dan huruf selalu mabni; fi'il mudhari' dan isim pada dasarnya mu'rab."},

  ]

{

{
  id:'alamat-irab', arNum:'٥', section:'dasar', title:"Tanda-tanda I'rab", arTitle:'علامات الإعراب',
  content:`
  <p>Setiap jenis i'rab memiliki tanda asli, namun pada beberapa jenis kata tertentu tanda tersebut digantikan tanda far'i (pengganti).</p>
  <table class="irab-table">
    <tr><th>I'rab</th><th>Tanda Asli</th></tr>
    <tr><td>Rafa'</td><td class="ar">الضَّمَّةُ (Dhammah)</td></tr>
    <tr><td>Nashab</td><td class="ar">الْفَتْحَةُ (Fathah)</td></tr>
    <tr><td>Khafadh</td><td class="ar">الْكَسْرَةُ (Kasrah)</td></tr>
    <tr><td>Jazm</td><td class="ar">السُّكُونُ (Sukun)</td></tr>
  </table>
  <p><b>Tanda far'i (pengganti)</b> berlaku pada kondisi berikut:</p>
  <ul>
    <li><b>Isim Tatsniyah</b> (dua): rafa' dengan <i>alif</i>, nashab &amp; khafadh dengan <i>ya'</i>. Contoh: <span class="arabic-inline">جَاءَ الْمُسْلِمَانِ</span></li>
    <li><b>Jamak Mudzakkar Salim</b>: rafa' dengan <i>wawu</i>, nashab &amp; khafadh dengan <i>ya'</i>. Contoh: <span class="arabic-inline">جَاءَ الْمُسْلِمُونَ</span></li>
    <li><b>Asma'ul Khamsah</b> (أَبٌ، أَخٌ، حَمٌ، فُو، ذُو): rafa' dengan <i>wawu</i>, nashab dengan <i>alif</i>, khafadh dengan <i>ya'</i>. Contoh: <span class="arabic-inline">جَاءَ أَبُوكَ</span></li>
    <li><b>Jamak Muannats Salim</b>: nashab dengan <i>kasrah</i> (menggantikan fathah). Contoh: <span class="arabic-inline">رَأَيْتُ الْمُسْلِمَاتِ</span></li>
    <li><b>Isim Ghairu Munsharif</b>: khafadh dengan <i>fathah</i> (menggantikan kasrah).</li>
    <li><b>Af'alul Khamsah</b>: rafa' dengan tetapnya <i>nun</i>, nashab &amp; jazm dengan membuang <i>nun</i>. Contoh: <span class="arabic-inline">يَفْعَلَانِ ← لَمْ يَفْعَلَا</span></li>
    <li><b>Fi'il Mudhari' Mu'tal Akhir</b>: jazm ditandai dengan membuang huruf illat. Contoh: <span class="arabic-inline">يَدْعُو ← لَمْ يَدْعُ</span></li>
  </ul>
  `,
  matan:[
    {ar:"لِلرَّفْعِ أَرْبَعُ عَلَامَاتٍ: الضَّمَّةُ، وَالْوَاوُ، وَالْأَلِفُ، وَالنُّونُ", id:"Rafa' memiliki empat tanda: dhammah, wawu, alif, dan nun."},
    {ar:"وَلِلنَّصْبِ خَمْسُ عَلَامَاتٍ: الْفَتْحَةُ، وَالْأَلِفُ، وَالْكَسْرَةُ، وَالْيَاءُ، وَحَذْفُ النُّونِ", id:"Nashab memiliki lima tanda: fathah, alif, kasrah, ya', dan membuang nun."},
    {ar:"وَلِلْخَفْضِ ثَلَاثُ عَلَامَاتٍ: الْكَسْرَةُ، وَالْيَاءُ، وَالْفَتْحَةُ", id:"Khafadh memiliki tiga tanda: kasrah, ya', dan fathah."},
    {ar:"وَلِلْجَزْمِ عَلَامَتَانِ: السُّكُونُ، وَحَذْفُ آخِرِهِ", id:"Jazm memiliki dua tanda: sukun dan membuang huruf akhirnya."}

  examples:[

      {text:'الْمُسْلِمُونَ', role:"Fa'il — Jamak Mudzakkar Salim", detail:"Marfu' dengan tanda far'i berupa wawu, karena berbentuk jamak mudzakkar salim."}

    {q:"Af'alul Khamsah dalam keadaan nashab/jazm ditandai dengan...", ar:"يَفْعَلَانِ ← لَمْ يَفْعَلَا", opts:["Tetapnya nun","Membuang nun","Fathah","Sukun"], answer:1, explain:"Af'alul khamsah di-nashab-kan/di-jazm-kan dengan membuang huruf nun-nya."},
    {q:"Jamak mudzakkar salim dalam keadaan rafa' ditandai dengan...", ar:"جَاءَ الْمُسْلِمُونَ", opts:["Alif","Wawu","Ya'","Dhammah biasa"], answer:1, explain:"Jamak mudzakkar salim rafa'-nya ditandai wawu sebagai tanda far'i."}
  ]

{
  id:'marfuat', arNum:'٦', section:'dasar', title:"Isim-isim yang Dirafa'kan", arTitle:'المرفوعات من الأسماء',
  content:`
  <p>Terdapat tujuh kedudukan isim yang selalu marfu' (dirafa'kan) dalam kalimat:</p>
  <ol>
    <li><b>Fa'il</b> — pelaku dari fi'il aktif. <span class="arabic-inline">قَامَ زَيْدٌ</span></li>
    <li><b>Na'ibul Fa'il</b> — pengganti pelaku pada fi'il pasif (mabni majhul). <span class="arabic-inline">ضُرِبَ زَيْدٌ</span></li>
    <li><b>Mubtada'</b> — subjek pada kalimat nominal (jumlah ismiyah). <span class="arabic-inline">زَيْدٌ قَائِمٌ</span></li>
    <li><b>Khabar</b> — predikat/berita tentang mubtada'. <span class="arabic-inline">زَيْدٌ قَائِمٌ</span></li>
    <li><b>Isim Kāna wa Akhawātihā</b> — subjek setelah كَانَ dan saudara-saudaranya (yang me-rafa'-kan isim dan me-nashab-kan khabar): <span class="arabic-inline">كَانَ، أَمْسَى، أَضْحَى، ظَلَّ، بَاتَ، صَارَ، لَيْسَ، مَا زَالَ، مَا انْفَكَّ، مَا فَتِئَ، مَا بَرِحَ، مَا دَامَ</span>. Contoh: <span class="arabic-inline">كَانَ زَيْدٌ قَائِمًا</span></li>
    <li><b>Khabar Inna wa Akhawātihā</b> — predikat setelah إِنَّ dan saudara-saudaranya (yang me-nashab-kan isim dan me-rafa'-kan khabar): <span class="arabic-inline">إِنَّ، أَنَّ (taukid)، لٰكِنَّ (istidrak)، كَأَنَّ (tasybih)، لَيْتَ (tamanni)، لَعَلَّ (tarajji)</span>. Contoh: <span class="arabic-inline">إِنَّ زَيْدًا قَائِمٌ</span></li>
    <li><b>Tawābi' lil-Marfū'</b> — kata yang mengikuti i'rab kata sebelumnya (na't/sifat, 'athaf, taukid, badal).</li>
  </ol>
  `,
  matan:[
    {ar:"الْمَرْفُوعَاتُ مِنَ الْأَسْمَاءِ سَبْعَةٌ: وَهِيَ الْفَاعِلُ، وَالْمَفْعُولُ الَّذِي لَمْ يُسَمَّ فَاعِلُهُ، وَالْمُبْتَدَأُ وَخَبَرُهُ، وَاسْمُ كَانَ وَأَخَوَاتِهَا، وَخَبَرُ إِنَّ وَأَخَوَاتِهَا، وَالتَّوَابِعُ لِلْمَرْفُوعِ", id:"Isim-isim yang dirafa'kan ada tujuh: fa'il, maf'ul yang tidak disebut fa'ilnya (na'ibul fa'il), mubtada' dan khabarnya, isim kana dan saudara-saudaranya, khabar inna dan saudara-saudaranya, serta kata-kata yang mengikuti i'rab marfu'."},
    {ar:"فَالْفَاعِلُ هُوَ الِاسْمُ الْمَرْفُوعُ الْمَذْكُورُ قَبْلَهُ فِعْلُهُ", id:"Fa'il adalah isim marfu' yang perbuatannya (fi'ilnya) disebutkan sebelum kata itu."},
    {ar:"الْمُبْتَدَأُ هُوَ الِاسْمُ الْمَرْفُوعُ الْعَارِي عَنِ الْعَوَامِلِ اللَّفْظِيَّةِ، وَالْخَبَرُ هُوَ الِاسْمُ الْمَرْفُوعُ الْمُسْنَدُ إِلَيْهِ", id:"Mubtada' adalah isim marfu' yang bersih dari 'amil lafzhi (tidak didahului 'amil yang tampak). Khabar adalah isim marfu' yang disandarkan kepadanya (menjadi predikatnya)."},
    {ar:"فَأَمَّا كَانَ وَأَخَوَاتُهَا فَإِنَّهَا تَرْفَعُ الِاسْمَ وَتَنْصِبُ الْخَبَرَ، وَهِيَ: كَانَ، وَأَمْسَى، وَأَضْحَى، وَظَلَّ، وَبَاتَ، وَصَارَ، وَلَيْسَ، وَمَا زَالَ، وَمَا انْفَكَّ، وَمَا فَتِئَ، وَمَا بَرِحَ، وَمَا دَامَ", id:"Adapun kana dan saudara-saudaranya, ia me-rafa'-kan isim dan me-nashab-kan khabar. Saudara-saudaranya adalah: amsa, adh-ha, zhalla, baata, shaara, laisa, maa zaala, maa infakka, maa fati'a, maa bariha, maa daama."},
    {ar:"وَأَمَّا إِنَّ وَأَخَوَاتُهَا فَإِنَّهَا تَنْصِبُ الِاسْمَ وَتَرْفَعُ الْخَبَرَ، وَهِيَ: إِنَّ، وَأَنَّ، وَلٰكِنَّ، وَكَأَنَّ، وَلَيْتَ، وَلَعَلَّ", id:"Adapun inna dan saudara-saudaranya, ia me-nashab-kan isim dan me-rafa'-kan khabar. Saudara-saudaranya adalah: inna, anna, lakinna, ka'anna, laita, la'alla."},
    {ar:"وَمَعْنَى إِنَّ وَأَنَّ لِلتَّوْكِيدِ، وَلٰكِنَّ لِلِاسْتِدْرَاكِ، وَكَأَنَّ لِلتَّشْبِيهِ، وَلَيْتَ لِلتَّمَنِّي، وَلَعَلَّ لِلتَّرَجِّي وَالتَّوَقُّعِ", id:"Makna inna dan anna adalah penegasan (taukid), lakinna untuk istidrak (mengoreksi), ka'anna untuk tasybih (penyerupaan), laita untuk tamanni (pengandaian), dan la'alla untuk tarajji wat-tawaqqu' (pengharapan)."}
  ],
  examples:[
    {label:"Kāna wa Akhawātuhā", words:[
      {text:'كَانَ', role:"Fi'il Madhi Naqish", detail:"Kata kerja bantu, mabni fathah, mengubah khabar mubtada' menjadi manshub."},
      {text:'زَيْدٌ', role:"Isim Kāna", detail:"Tetap marfu' dengan dhammah — inilah subjek asal (mubtada')."},
      {text:'قَائِمًا', role:"Khabar Kāna", detail:"Manshub dengan fathah — khabar yang semula marfu' menjadi manshub karena masuknya كَانَ."}
    ]},
    {label:"Na'ibul Fa'il", words:[
      {text:'ضُرِبَ', role:"Fi'il Majhul", detail:"Fi'il pasif, mabni dhammah pada huruf pertama & kasrah sebelum akhir."},
      {text:'زَيْدٌ', role:"Na'ibul Fa'il", detail:"Marfu' dengan dhammah, menggantikan kedudukan fa'il karena fa'il aslinya tidak disebut."}
    ]}
  ],
  quiz:[
    {q:"Pelaku dari sebuah fi'il aktif disebut...", ar:"قَامَ زَيْدٌ", opts:["Maf'ul bih","Fa'il","Mubtada'","Khabar"], answer:1, explain:"Zaid di sini adalah fa'il — pelaku dari perbuatan قَامَ."},
    {q:"Pada contoh إِنَّ زَيْدًا قَائِمٌ, kata قَائِمٌ berkedudukan sebagai...", ar:"إِنَّ زَيْدًا قَائِمٌ", opts:["Isim Inna","Khabar Inna","Fa'il","Maf'ul bih"], answer:1, explain:"قَائِمٌ tetap marfu' sebagai khabar Inna, sedangkan زَيْدًا menjadi manshub sebagai isim Inna."},
    {q:"Manakah yang BUKAN termasuk tujuh isim marfu'?", ar:"", opts:["Fa'il","Mubtada'","Maf'ul bih","Khabar"], answer:2, explain:"Maf'ul bih termasuk isim yang di-nashab-kan (manshub), bukan marfu'."},
    {q:"Pada kalimat ضُرِبَ زَيْدٌ, kata زَيْدٌ berkedudukan sebagai...", ar:"ضُرِبَ زَيْدٌ", opts:["Fa'il","Na'ibul Fa'il","Maf'ul bih","Mudhaf ilaih"], answer:1, explain:"Karena fi'ilnya majhul (pasif), زَيْدٌ menjadi na'ibul fa'il, menggantikan posisi fa'il yang tidak disebut."}
  ]
},
{
  id:'mansubat', arNum:'٧', section:'dasar', title:"Isim-isim yang Dinashabkan", arTitle:'المنصوبات من الأسماء',
  content:`
  <p>Di antara kedudukan isim yang manshub (dinashabkan) adalah:</p>
  <ul>
    <li><b>Maf'ul Bih</b> — objek yang dikenai perbuatan. <span class="arabic-inline">ضَرَبَ زَيْدٌ عَمْرًا</span></li>
    <li><b>Mashdar (Maf'ul Muthlaq)</b> — kata benda turunan fi'il yang menegaskan perbuatan. <span class="arabic-inline">ضَرَبْتُهُ ضَرْبًا</span></li>
    <li><b>Zharaf Zaman &amp; Zharaf Makan</b> — keterangan waktu/tempat. <span class="arabic-inline">جَلَسْتُ أَمَامَ الْمَسْجِدِ</span></li>
    <li><b>Hal</b> — keterangan keadaan pelaku/objek. <span class="arabic-inline">جَاءَ زَيْدٌ رَاكِبًا</span></li>
    <li><b>Tamyiz</b> — penjelas kesamaran suatu kata sebelumnya. <span class="arabic-inline">اِشْتَرَيْتُ عِشْرِينَ كِتَابًا</span></li>
    <li><b>Mustatsna</b> — isim yang dikecualikan setelah إِلَّا. <span class="arabic-inline">جَاءَ الْقَوْمُ إِلَّا زَيْدًا</span></li>
    <li><b>Isim "لَا" Nafiyah lil-Jins</b> — meniadakan jenis secara mutlak. <span class="arabic-inline">لَا رَجُلَ فِي الدَّارِ</span></li>
    <li><b>Munada</b> — isim yang dipanggil. <span class="arabic-inline">يَا عَبْدَ اللهِ</span></li>
    <li><b>Maf'ul li Ajlih</b> — menerangkan sebab perbuatan. <span class="arabic-inline">قُمْتُ إِجْلَالًا لِلْأُسْتَاذِ</span></li>
    <li><b>Maf'ul Ma'ah</b> — menyertai perbuatan. <span class="arabic-inline">سِرْتُ وَالنَّهْرَ</span></li>
    <li><b>Khabar Kāna</b> dan <b>Isim Inna</b> (lihat bab sebelumnya)</li>
    <li><b>Tawābi' lil-Manshūb</b> — kata yang mengikuti i'rab manshub sebelumnya.</li>
  </ul>
  `,
  matan:[
    {ar:"الْمَنْصُوبَاتُ مِنَ الْأَسْمَاءِ خَمْسَةَ عَشَرَ، وَهِيَ: الْمَفْعُولُ بِهِ، وَالْمَصْدَرُ، وَظَرْفُ الزَّمَانِ، وَظَرْفُ الْمَكَانِ، وَالْحَالُ، وَالتَّمْيِيزُ، وَالْمُسْتَثْنَى، وَاسْمُ لَا، وَالْمُنَادَى، وَالْمَفْعُولُ مِنْ أَجْلِهِ، وَالْمَفْعُولُ مَعَهُ، وَخَبَرُ كَانَ وَأَخَوَاتِهَا، وَاسْمُ إِنَّ وَأَخَوَاتِهَا، وَالتَّوَابِعُ لِلْمَنْصُوبِ وَهِيَ أَرْبَعَةُ أَشْيَاءَ: النَّعْتُ، وَالْعَطْفُ، وَالتَّوْكِيدُ، وَالْبَدَلُ", id:"Isim-isim yang dinashabkan ada lima belas: maf'ul bih, mashdar, zharaf zaman, zharaf makan, hal, tamyiz, mustatsna, isim la, munada, maf'ul li ajlih, maf'ul ma'ah, khabar kana dan saudaranya, isim inna dan saudaranya, serta tawabi' bagi yang manshub yaitu empat perkara: na't, 'athaf, taukid, dan badal."}
  ],
  examples:[
    {label:"Maf'ul Bih", words:[
      {text:'ضَرَبَ', role:"Fi'il Madhi", detail:"Kata kerja lampau, mabni fathah."},
      {text:'زَيْدٌ', role:"Fa'il", detail:"Marfu' dengan dhammah — pelaku perbuatan memukul."},
      {text:'عَمْرًا', role:"Maf'ul Bih", detail:"Manshub dengan fathah — objek yang menerima perbuatan (yang dipukul)."}
    ]},
    {label:"Munada (Isim Dipanggil)", words:[
      {text:'يَا', role:"Huruf Nida'", detail:"Huruf seru untuk memanggil, mabni, tidak menerima i'rab."},
      {text:'عَبْدَ', role:"Munada Mudhaf", detail:"Manshub dengan fathah karena berstatus mudhaf (disandarkan ke kata setelahnya)."},
      {text:'اللهِ', role:"Mudhaf Ilaih", detail:"Majrur dengan kasrah karena menjadi sandaran dari kata عَبْدَ."}
    ]}
  ],
  quiz:[
    {q:"Objek yang dikenai perbuatan dalam kalimat disebut...", ar:"ضَرَبَ زَيْدٌ عَمْرًا", opts:["Fa'il","Maf'ul Bih","Mubtada'","Khabar"], answer:1, explain:"عَمْرًا adalah maf'ul bih — objek yang dipukul, i'rab-nya manshub."},
    {q:"Kata setelah إِلَّا yang dikecualikan disebut...", ar:"جَاءَ الْقَوْمُ إِلَّا زَيْدًا", opts:["Mustatsna","Tamyiz","Hal","Munada"], answer:0, explain:"زَيْدًا di sini adalah mustatsna, manshub karena dikecualikan dari kaum yang datang."},
    {q:"Keterangan keadaan seperti رَاكِبًا pada جَاءَ زَيْدٌ رَاكِبًا disebut...", ar:"", opts:["Zharaf","Hal","Tamyiz","Maf'ul li ajlih"], answer:1, explain:"رَاكِبًا menerangkan keadaan Zaid saat datang (berkendara), inilah hal, i'rabnya manshub."},
    {q:"Pada يَا عَبْدَ اللهِ, kata عَبْدَ ber-i'rab manshub karena berkedudukan sebagai...", ar:"يَا عَبْدَ اللهِ", opts:["Mustatsna","Munada Mudhaf","Hal","Tamyiz"], answer:1, explain:"عَبْدَ adalah munada yang berstatus mudhaf, sehingga manshub dengan fathah."}
  ]

{
  id:'majrurat', arNum:'٨', section:'dasar', title:"Isim-isim yang Dikhafadhkan", arTitle:'المخفوضات من الأسماء',
  content:`
  <p>Isim menjadi majrur (dikhafadhkan) melalui tiga sebab:</p>
  <ul>
    <li><b>Huruf Jar</b> — isim yang didahului salah satu huruf jar berikut selalu majrur: <span class="arabic-inline">مِنْ، إِلَى، عَنْ، عَلَى، فِي، رُبَّ، الْبَاءُ، الْكَافُ، اللَّامُ</span>, serta huruf sumpah <span class="arabic-inline">وَ، بِ، تَ</span>. Contoh: <span class="arabic-inline">ذَهَبْتُ إِلَى الْمَسْجِدِ</span></li>
    <li><b>Idhafah</b> (penyandaran) — isim kedua dalam susunan idhafah (mudhaf–mudhaf ilaih) selalu majrur. Contoh: <span class="arabic-inline">كِتَابُ الطَّالِبِ</span> — "kitab" adalah mudhaf (mengikuti kedudukannya dalam kalimat), sedangkan "ath-thalib" adalah mudhaf ilaih yang selalu majrur.</li>
    <li><b>Tawabi' lil-Makhfudh</b> (mengikuti isim majrur) — kata yang mengikuti (na't, 'athaf, taukid, atau badal) dari isim yang sudah majrur, ikut menjadi majrur juga. Contoh: <span class="arabic-inline">مَرَرْتُ بِزَيْدٍ الْفَاضِلِ</span> — الْفَاضِلِ adalah na't dari زَيْدٍ yang majrur, sehingga ia pun majrur.</li>
  </ul>
  <div class="note-box">Ingat kaidah dari Bab 4: isim tidak pernah di-jazm-kan, dan majrur/khafadh adalah salah satu dari tiga i'rab yang khusus berlaku untuk isim.</div>
  `,
  matan:[
    {ar:"الْمَخْفُوضَاتُ مِنَ الْأَسْمَاءِ ثَلَاثَةُ أَنْوَاعٍ: مَخْفُوضٌ بِالْحَرْفِ، وَمَخْفُوضٌ بِالْإِضَافَةِ، وَتَابِعٌ لِلْمَخْفُوضِ", id:"Isim-isim yang dikhafadhkan ada tiga macam: dikhafadhkan dengan huruf, dikhafadhkan dengan idhafah, dan yang mengikuti (tawabi') isim majrur sebelumnya."},
    {ar:"فَأَمَّا الْمَخْفُوضُ بِالْحَرْفِ فَهُوَ مَا يَنْخَفِضُ بِمِنْ، وَإِلَى، وَعَنْ، وَعَلَى، وَفِي، وَرُبَّ، وَالْبَاءِ، وَالْكَافِ، وَاللَّامِ، وَحُرُوفِ الْقَسَمِ", id:"Adapun yang dikhafadhkan dengan huruf adalah yang di-khafadh-kan dengan min, ila, 'an, 'ala, fi, rubba, ba', kaf, lam, dan huruf-huruf sumpah."},
    {ar:"وَأَمَّا الْمَخْفُوضُ بِالْإِضَافَةِ فَنَحْوُ قَوْلِكَ: غُلَامُ زَيْدٍ", id:"Adapun yang dikhafadhkan dengan idhafah, seperti ucapanmu: 'ghulamu Zaid' (pembantu Zaid)."}
  ],
  examples:[
    {label:"Idhafah", words:[
      {text:'كِتَابُ', role:"Mudhaf", detail:"Tidak ber-tanwin karena berstatus mudhaf; i'rabnya mengikuti kedudukan dalam kalimat (di sini marfu' sebagai mubtada')."},
      {text:'الطَّالِبِ', role:"Mudhaf Ilaih", detail:"Selalu majrur (kasrah) karena menjadi sandaran dari mudhaf sebelumnya."}
    ]},
    {label:"Huruf Jar", words:[
      {text:'ذَهَبْتُ', role:"Fi'il Madhi + Fa'il", detail:"ذَهَبَ mabni fathah, تُ adalah dhamir fa'il."},
      {text:'إِلَى', role:"Huruf Jar", detail:"Mabni, menyebabkan isim setelahnya menjadi majrur."},
      {text:'الْمَسْجِدِ', role:"Isim Majrur", detail:"Majrur dengan kasrah karena didahului huruf jar إِلَى."}
    ]},
    {label:"Tawabi' lil-Makhfudh", words:[
      {text:'مَرَرْتُ', role:"Fi'il Madhi + Fa'il", detail:"مَرَّ mabni fathah, تُ adalah dhamir fa'il."},
      {text:'بِزَيْدٍ', role:"Huruf Jar + Isim Majrur", detail:"بِ adalah huruf jar, زَيْدٍ majrur dengan kasrah karenanya."},
      {text:'الْفَاضِلِ', role:"Na't — Tabi' lil-Makhfudh", detail:"Mengikuti i'rab زَيْدٍ (majrur), karena berkedudukan sebagai na't (sifat) dari isim yang majrur."}
    ]}
  ],
  quiz:[
    {q:"Isim setelah huruf jar seperti مِنْ atau إِلَى selalu ber-i'rab...", ar:"", opts:["Marfu'","Manshub","Majrur","Majzum"], answer:2, explain:"Isim yang didahului huruf jar selalu majrur (dikhafadhkan)."},
    {q:"Pada susunan idhafah كِتَابُ الطَّالِبِ, kata الطَّالِبِ disebut...", ar:"", opts:["Mudhaf","Mudhaf Ilaih","Fa'il","Khabar"], answer:1, explain:"الطَّالِبِ adalah mudhaf ilaih, selalu majrur dalam susunan idhafah."},
    {q:"Mengapa kata كِتَابُ pada كِتَابُ الطَّالِبِ tidak ber-tanwin?", ar:"", opts:["Karena isim ghairu munsharif","Karena berstatus mudhaf","Karena mabni","Karena majrur"], answer:1, explain:"Isim yang berstatus mudhaf tidak menerima tanwin."},
    {q:"Sebab ketiga isim menjadi majrur, selain huruf jar dan idhafah, adalah...", ar:"مَرَرْتُ بِزَيْدٍ الْفَاضِلِ", opts:["Menjadi fa'il","Menjadi khabar","Mengikuti (tabi') isim majrur sebelumnya","Menjadi maf'ul bih"], answer:2, explain:"Isim yang menjadi tabi' (na't, 'athaf, taukid, atau badal) dari isim majrur, ikut majrur juga — inilah sebab ketiga."}
  ]
},
{
  id:'mudhari-irab', arNum:'٩', section:'dasar', title:"I'rab Fi'il Mudhari'", arTitle:'إعراب الفعل المضارع',
  content:`
  <p>Fi'il mudhari' pada asalnya <b>marfu'</b> selama tidak dimasuki 'amil nashab maupun 'amil jazm.</p>
  <p><b>'Amil Nashab</b> (membuat fi'il mudhari' menjadi manshub): <span class="arabic-inline">أَنْ، لَنْ، إِذَنْ، كَيْ</span>, serta <span class="arabic-inline">لَامُ كَيْ، لَامُ الْجُحُودِ، حَتَّى، فَاءُ السَّبَبِيَّةِ، وَاوُ الْمَعِيَّةِ، أَوْ</span>. Contoh: <span class="arabic-inline">لَنْ يَذْهَبَ</span></p>
  <p><b>'Amil Jazm</b> (membuat fi'il mudhari' menjadi majzum): <span class="arabic-inline">لَمْ، لَمَّا، لَامُ الْأَمْرِ، لَا النَّاهِيَةُ</span>, serta adawatu syarath seperti <span class="arabic-inline">إِنْ، مَنْ، مَا، مَهْمَا، مَتَى، أَيْنَ</span>. Contoh: <span class="arabic-inline">لَمْ يَذْهَبْ</span></p>
  <table class="irab-table">
    <tr><th>Keadaan</th><th>Tanda I'rab</th><th>Contoh</th></tr>
    <tr><td>Rafa' (asal)</td><td>Dhammah</td><td class="ar">يَذْهَبُ</td></tr>
    <tr><td>Nashab</td><td>Fathah</td><td class="ar">لَنْ يَذْهَبَ</td></tr>
    <tr><td>Jazm</td><td>Sukun</td><td class="ar">لَمْ يَذْهَبْ</td></tr>
  </table>
  `,
  matan:[
    {ar:"وَهُوَ مَرْفُوعٌ أَبَدًا حَتَّى يَدْخُلَ عَلَيْهِ نَاصِبٌ أَوْ جَازِمٌ", id:"Fi'il mudhari' senantiasa marfu' hingga dimasuki 'amil nashab atau 'amil jazm."},
    {ar:"فَالنَّوَاصِبُ عَشَرَةٌ وَهِيَ: أَنْ، وَلَنْ، وَإِذَنْ، وَكَيْ، وَلَامُ كَيْ، وَلَامُ الْجُحُودِ، وَحَتَّى، وَالْجَوَابُ بِالْفَاءِ، وَالْوَاوُ، وَأَوْ", id:"'Amil-'amil nashab ada sepuluh: an, lan, idzan, kay, lam kay, lam juhud, hatta, fa' jawab, wawu, dan au."},
    {ar:"وَالْجَوَازِمُ ثَمَانِيَةَ عَشَرَ، وَهِيَ: لَمْ، وَلَمَّا، وَأَلَمْ، وَأَلَمَّا، وَلَامُ الْأَمْرِ وَالدُّعَاءِ، وَلَا فِي النَّهْيِ وَالدُّعَاءِ، وَإِنْ، وَمَا، وَمَنْ، وَمَهْمَا، وَإِذْمَا، وَأَيٌّ، وَمَتَى، وَأَيَّانَ، وَأَيْنَ، وَأَنَّى، وَحَيْثُمَا، وَكَيْفَمَا", id:"'Amil-'amil jazm ada delapan belas, di antaranya: lam, lamma, lam perintah, la larangan, serta adawatu syarath seperti in, ma, man, mahma, mata, ayna, dan lainnya."}
  ],
  examples:[
    {label:"Nashab", words:[
      {text:'لَنْ', role:"'Amil Nashab", detail:"Huruf yang menashabkan fi'il mudhari' setelahnya, sekaligus meniadakan makna di masa depan."},
      {text:'يَذْهَبَ', role:"Fi'il Mudhari' Manshub", detail:"Ber-i'rab nashab dengan tanda fathah karena didahului huruf لَنْ."}
    ]},
    {label:"Jazm dengan Syarat", words:[
      {text:'إِنْ', role:"Huruf Syarat", detail:"Men-jazm-kan dua fi'il mudhari' setelahnya (fi'il syarat & jawab syarat)."},
      {text:'تَجْتَهِدْ', role:"Fi'il Syarat", detail:"Majzum dengan sukun karena menjadi fi'il syarat setelah إِنْ."},
      {text:'تَنْجَحْ', role:"Jawab Syarat", detail:"Majzum dengan sukun sebagai jawaban dari syarat sebelumnya."}
    ]}
  ],
  quiz:[
    {q:"Fi'il mudhari' pada asalnya ber-i'rab...", ar:"", opts:["Manshub","Majzum","Marfu'","Majrur"], answer:2, explain:"Selama tidak dimasuki 'amil nashab/jazm, fi'il mudhari' asalnya marfu'."},
    {q:"Huruf لَمْ berfungsi sebagai...", ar:"لَمْ يَذْهَبْ", opts:["'Amil Nashab","'Amil Jazm","Huruf Jar","Huruf 'Athaf"], answer:1, explain:"لَمْ men-jazm-kan fi'il mudhari' setelahnya dan mengubah maknanya menjadi negasi masa lampau."},
    {q:"Tanda i'rab jazm pada fi'il mudhari' shahih akhir adalah...", ar:"", opts:["Fathah","Dhammah","Kasrah","Sukun"], answer:3, explain:"Sukun adalah tanda asli jazm."},
    {q:"Pada إِنْ تَجْتَهِدْ تَنْجَحْ, berapa fi'il mudhari' yang di-jazm-kan oleh huruf syarat إِنْ?", ar:"إِنْ تَجْتَهِدْ تَنْجَحْ", opts:["Satu","Dua","Tiga","Tidak ada"], answer:1, explain:"Huruf syarat men-jazm-kan dua fi'il sekaligus: fi'il syarat (تَجْتَهِدْ) dan jawab syarat (تَنْجَحْ)."}
  ]
},
{
  id:'afal-khamsah', arNum:'١٠', section:'lanjutan', title:"Af'alul Khamsah", arTitle:'الأفعال الخمسة',
  content:`
  <p><b>Af'alul Khamsah</b> (lima bentuk fi'il) adalah fi'il mudhari' yang bersambung dengan salah satu dari: <i>alif tatsniyah</i>, <i>wawu jamak</i>, atau <i>ya' mukhathabah</i>. Kelima bentuknya adalah:</p>
  <table class="irab-table">
    <tr><th>Bentuk</th><th>Makna</th></tr>
    <tr><td class="ar">يَفْعَلَانِ</td><td>mereka berdua (laki-laki) sedang/akan melakukan</td></tr>
    <tr><td class="ar">تَفْعَلَانِ</td><td>kalian berdua sedang/akan melakukan</td></tr>
    <tr><td class="ar">يَفْعَلُونَ</td><td>mereka (laki-laki, jamak) sedang/akan melakukan</td></tr>
    <tr><td class="ar">تَفْعَلُونَ</td><td>kalian (jamak) sedang/akan melakukan</td></tr>
    <tr><td class="ar">تَفْعَلِينَ</td><td>kamu (perempuan) sedang/akan melakukan</td></tr>
  </table>
  <p>Af'alul khamsah di-<b>rafa'</b>-kan dengan <b>tetapnya huruf nun</b>, dan di-<b>nashab</b>-kan maupun di-<b>jazm</b>-kan dengan <b>membuang huruf nun</b> tersebut.</p>
  <table class="irab-table">
    <tr><th>Keadaan</th><th>Contoh</th><th>Tanda</th></tr>
    <tr><td>Rafa'</td><td class="ar">هُمْ يَفْعَلُونَ</td><td>Tetapnya nun</td></tr>
    <tr><td>Nashab</td><td class="ar">لَنْ يَفْعَلُوا</td><td>Membuang nun</td></tr>
    <tr><td>Jazm</td><td class="ar">لَمْ يَفْعَلُوا</td><td>Membuang nun</td></tr>
  </table>
  `,
  matanInfo:"Af'alul khamsah bukan bab tersendiri dalam matan asli, melainkan bagian dari penjelasan tanda i'rab (lihat kutipan matan pada Bab 5: 'wa lin-nashbi khamsu 'alamat... wa hadzfun nun'). Bab ini disusun terpisah agar pembahasannya lebih rinci dan mudah dipelajari.",
  examples:[
    {label:"Rafa', Nashab, Jazm", words:[
      {text:'يَفْعَلُونَ', role:"Rafa'", detail:"Marfu' dengan tanda far'i berupa tetapnya huruf nun di akhir kata."},
      {text:'لَنْ يَفْعَلُوا', role:"Nashab", detail:"Manshub dengan tanda far'i berupa dibuangnya huruf nun (setelah 'amil nashab لَنْ)."},
      {text:'لَمْ يَفْعَلُوا', role:"Jazm", detail:"Majzum dengan tanda far'i berupa dibuangnya huruf nun (setelah 'amil jazm لَمْ)."}
    ]}
  ],
  quiz:[
    {q:"Af'alul khamsah adalah fi'il mudhari' yang bersambung dengan...", ar:"", opts:["Ta' ta'nits","Alif tatsniyah, wawu jamak, atau ya' mukhathabah","Nun taukid","Huruf jar"], answer:1, explain:"Kelima bentuk af'alul khamsah selalu bersambung dengan salah satu dari tiga huruf tersebut."},
    {q:"Tanda rafa' pada af'alul khamsah adalah...", ar:"هُمْ يَفْعَلُونَ", opts:["Dhammah","Tetapnya nun","Wawu","Alif"], answer:1, explain:"Af'alul khamsah dalam keadaan rafa' ditandai dengan tetapnya huruf nun."},
    {q:"Perhatikan لَنْ يَفْعَلُوا. Mengapa huruf nun pada يَفْعَلُونَ hilang?", ar:"لَنْ يَفْعَلُوا", opts:["Karena di-jazm-kan","Karena di-nashab-kan oleh لَنْ, tandanya membuang nun","Karena kesalahan penulisan","Karena isim ghairu munsharif"], answer:1, explain:"لَنْ adalah 'amil nashab; pada af'alul khamsah, nashab ditandai dengan membuang huruf nun."}
  ]
},
{
  id:'fiil-jenis', arNum:'١١', section:'lanjutan', title:"Fi'il: Madhi, Mudhari', Amr", arTitle:'أقسام الفعل',
  content:`
  <p>Fi'il (kata kerja) terbagi tiga berdasarkan waktu terjadinya perbuatan:</p>
  <ul>
    <li><b>Fi'il Madhi</b> — menunjukkan pekerjaan yang telah terjadi (lampau). Selalu <b>mabni</b>. Ciri: dapat dimasuki ta' ta'nits sakinah (<span class="arabic-inline">قَامَتْ</span>) dan ta' fa'il (<span class="arabic-inline">قُمْتُ</span>).</li>
    <li><b>Fi'il Mudhari'</b> — menunjukkan pekerjaan yang sedang atau akan terjadi. Selalu diawali salah satu huruf mudhara'ah: <span class="arabic-inline">أ ن ي ت</span> (hamzah, nun, ya', ta'). Bersifat <b>mu'rab</b>.</li>
    <li><b>Fi'il Amr</b> — menunjukkan tuntutan untuk melakukan suatu perbuatan (perintah). Selalu <b>mabni</b>. Ciri: dapat menerima ya' mukhathabah muannats (<span class="arabic-inline">اُكْتُبِي</span>) dan menunjukkan tuntutan pekerjaan tanpa huruf mudhara'ah.</li>
  </ul>
  <table class="irab-table">
    <tr><th>Jenis</th><th>Contoh</th><th>Status I'rab</th></tr>
    <tr><td>Madhi</td><td class="ar">كَتَبَ</td><td>Mabni fathah</td></tr>
    <tr><td>Mudhari'</td><td class="ar">يَكْتُبُ</td><td>Mu'rab, asalnya marfu'</td></tr>
    <tr><td>Amr</td><td class="ar">اُكْتُبْ</td><td>Mabni sukun</td></tr>
  </table>
  `,
  matan:[
    {ar:"الْأَفْعَالُ ثَلَاثَةٌ: مَاضٍ، وَمُضَارِعٌ، وَأَمْرٌ، نَحْوَ: ضَرَبَ، يَضْرِبُ، اضْرِبْ", id:"Fi'il ada tiga: madhi, mudhari', dan amr. Contoh: dhoroba (telah memukul), yadhribu (sedang memukul), idhrib (pukullah)."},
    {ar:"فَالْمَاضِي مَفْتُوحٌ أَبَدًا، وَالْأَمْرُ مَجْزُومٌ أَبَدًا", id:"Fi'il madhi senantiasa mabni fathah, dan fi'il amr senantiasa mabni jazm (sukun)."},
    {ar:"وَالْمُضَارِعُ مَا كَانَ فِي أَوَّلِهِ إِحْدَى الزَّوَائِدِ الْأَرْبَعِ الَّتِي يَجْمَعُهَا قَوْلُكَ أَنَيْتُ", id:"Fi'il mudhari' adalah yang di awalnya terdapat salah satu dari empat huruf tambahan, yang terkumpul dalam kata 'anaitu' (hamzah, nun, ya', ta')."}
  ],
  examples:[
    {label:"Tiga Bentuk Fi'il", words:[
      {text:'كَتَبَ', role:"Fi'il Madhi", detail:"Menunjukkan perbuatan menulis yang sudah terjadi. Mabni fathah."},
      {text:'يَكْتُبُ', role:"Fi'il Mudhari'", detail:"Menunjukkan perbuatan menulis yang sedang/akan terjadi. Diawali huruf ي (mudhara'ah), mu'rab marfu'."},
      {text:'اُكْتُبْ', role:"Fi'il Amr", detail:"Perintah untuk menulis. Mabni sukun."}
    ]}
  ],
  quiz:[
    {q:"Ciri khas fi'il madhi adalah dapat dimasuki...", ar:"قَامَتْ", opts:["Huruf mudhara'ah","Ta' ta'nits sakinah","Alif-lam","Huruf jar"], answer:1, explain:"Ta' ta'nits sakinah (ta' sukun tanda perempuan) adalah ciri khas fi'il madhi."},
    {q:"Fi'il mudhari' selalu diawali salah satu dari empat huruf berikut, kecuali...", ar:"", opts:["أ (hamzah)","ن (nun)","ي (ya')","ك (kaf)"], answer:3, explain:"Huruf mudhara'ah hanya empat: أ ن ي ت — bukan ك."},
    {q:"Status i'rab fi'il amr adalah...", ar:"اُكْتُبْ", opts:["Mu'rab marfu'","Mu'rab manshub","Mabni","Mu'rab majrur"], answer:2, explain:"Fi'il amr selalu mabni (biasanya sukun), tidak menerima i'rab."}
  ]
},
{
  id:'marifah-nakirah', arNum:'١٢', section:'lanjutan', title:"Ma'rifah, Nakirah & Isim Ghairu Munsharif", arTitle:'المعرفة والنكرة والممنوع من الصرف',
  content:`
  <p><b>Nakirah</b> adalah isim yang menunjukkan sesuatu secara umum, belum tertentu, dan pada asalnya dapat menerima alif-lam. Contoh: <span class="arabic-inline">رَجُلٌ</span> (seorang laki-laki).</p>
  <p><b>Ma'rifah</b> adalah isim yang menunjukkan sesuatu yang sudah tertentu. Matan asli menyebutkan lima macam — isim dhamir, isim 'alam, isim mubham (samar), isim ber-alif-lam, dan mudhaf kepada salah satu dari empat itu. "Isim mubham" mencakup isim isyarah, dan menurut mayoritas ulama nahwu serta tradisi pesantren juga mencakup isim maushul, sehingga lazim diajarkan terpisah menjadi enam macam berikut:</p>
  <ol>
    <li>Isim Dhamir (kata ganti): <span class="arabic-inline">أَنَا، أَنْتَ، هُوَ</span></li>
    <li>Isim 'Alam (nama): <span class="arabic-inline">مُحَمَّدٌ، مَكَّةُ</span></li>
    <li>Isim Isyarah (kata tunjuk): <span class="arabic-inline">هٰذَا، تِلْكَ</span></li>
    <li>Isim Maushul (kata sambung): <span class="arabic-inline">الَّذِي، الَّتِي</span></li>
    <li>Isim yang ber-alif-lam: <span class="arabic-inline">الْكِتَابُ</span></li>
    <li>Isim yang di-idhafah-kan kepada salah satu dari empat di atas: <span class="arabic-inline">كِتَابُ مُحَمَّدٍ</span></li>
  </ol>
  <p><b>Isim Ghairu Munsharif</b> adalah isim ma'rifah tertentu (biasanya 'alam atau sifat dengan pola tertentu) yang <b>tidak menerima tanwin</b>. Ciri khasnya: dalam keadaan khafadh, tandanya bukan kasrah melainkan <b>fathah</b>.</p>
  `,
  matan:[
    {ar:"وَالْمَعْرِفَةُ خَمْسَةُ أَشْيَاءَ: الِاسْمُ الْمُضْمَرُ نَحْوَ: أَنَا وَأَنْتَ، وَالِاسْمُ الْعَلَمُ نَحْوَ: زَيْدٍ وَمَكَّةَ، وَالِاسْمُ الْمُبْهَمُ نَحْوَ: هٰذَا وَهٰذِهِ وَهٰؤُلَاءِ، وَالِاسْمُ الَّذِي فِيهِ الْأَلِفُ وَاللَّامُ نَحْوَ: الرَّجُلُ وَالْغُلَامُ، وَمَا أُضِيفَ إِلَى وَاحِدٍ مِنْ هٰذِهِ الْأَرْبَعَةِ", id:"Ma'rifah ada lima macam: isim dhamir seperti ana dan anta; isim 'alam seperti Zaid dan Makkah; isim mubham (samar) seperti hadza, hadzihi, ha'ula'i; isim yang ber-alif-lam seperti ar-rajul dan al-ghulam; dan isim yang di-idhafah-kan kepada salah satu dari empat macam di atas."},
    {ar:"وَالنَّكِرَةُ كُلُّ اسْمٍ شَائِعٍ فِي جِنْسِهِ لَا يَخْتَصُّ بِهِ وَاحِدٌ دُونَ آخَرَ، وَتَقْرِيبُهُ كُلُّ مَا صَلُحَ دُخُولُ الْأَلِفِ وَاللَّامِ عَلَيْهِ", id:"Nakirah adalah setiap isim yang umum dalam jenisnya, tidak khusus untuk satu individu tertentu. Pendekatannya (cara mudah mengenalinya): setiap kata yang bisa menerima kemasukan alif-lam."}
  ],
  examples:[
    {label:"Isim Ghairu Munsharif", words:[
      {text:'صَلَّيْتُ', role:"Fi'il + Fa'il", detail:"صَلَّى mabni fathah, تُ adalah dhamir fa'il."},
      {text:'فِي', role:"Huruf Jar", detail:"Menyebabkan isim setelahnya majrur."},
      {text:'مَسَاجِدَ', role:"Isim Majrur — Ghairu Munsharif", detail:"Majrur dengan tanda far'i berupa fathah (bukan kasrah), karena termasuk isim ghairu munsharif (sighat muntahal jumu')."}
    ]}
  ],
  quiz:[
    {q:"Isim yang menunjukkan sesuatu secara umum dan belum tertentu disebut...", ar:"", opts:["Ma'rifah","Nakirah","Mudhaf","Mabni"], answer:1, explain:"Nakirah adalah isim umum yang belum tertentu, biasanya ber-tanwin."},
    {q:"Manakah yang TERMASUK isim ma'rifah?", ar:"", opts:["رَجُلٌ","كِتَابٌ","هٰذَا","بَيْتٌ"], answer:2, explain:"هٰذَا adalah isim isyarah, salah satu dari enam macam isim ma'rifah."},
    {q:"Ciri khas isim ghairu munsharif dalam keadaan khafadh adalah...", ar:"فِي مَسَاجِدَ", opts:["Ditandai kasrah seperti biasa","Ditandai fathah, bukan kasrah","Ditandai dhammah","Tidak menerima khafadh"], answer:1, explain:"Isim ghairu munsharif dikhafadhkan dengan tanda far'i berupa fathah."}
  ]
},
{
  id:'tawabi', arNum:'١٣', section:'lanjutan', title:"Tawabi': Na't, 'Athaf, Taukid, Badal", arTitle:'التوابع',
  content:`
  <p><b>Tawabi'</b> adalah kata yang selalu mengikuti i'rab kata sebelumnya — apa pun i'rab kata sebelumnya (rafa', nashab, atau khafadh), kata yang mengikutinya (tabi') akan mengambil i'rab yang sama. Ada empat macam tawabi':</p>
  <ul>
    <li><b>Na't</b> (sifat) — menerangkan sifat dari isim sebelumnya (man'ut). Contoh: <span class="arabic-inline">جَاءَ رَجُلٌ صَالِحٌ</span> — صَالِحٌ mengikuti رَجُلٌ yang marfu'.</li>
    <li><b>'Athaf</b> — menghubungkan dua kata atau lebih dengan huruf 'athaf seperti <span class="arabic-inline">وَ، فَ، ثُمَّ، أَوْ</span>. Contoh: <span class="arabic-inline">جَاءَ زَيْدٌ وَعَمْرٌو</span> — عَمْرٌو mengikuti زَيْدٌ yang marfu'.</li>
    <li><b>Taukid</b> — menegaskan/memperkuat kata sebelumnya, dengan lafazh seperti <span class="arabic-inline">نَفْسُ، عَيْنُ، كُلُّ</span>. Contoh: <span class="arabic-inline">جَاءَ زَيْدٌ نَفْسُهُ</span>.</li>
    <li><b>Badal</b> — kata pengganti yang menjelaskan maksud kata sebelumnya secara lebih tepat. Contoh: <span class="arabic-inline">جَاءَ أَخُوكَ زَيْدٌ</span> — زَيْدٌ adalah badal dari أَخُوكَ.</li>
  </ul>
  <div class="note-box"><b>Kaidah utama:</b> tabi' selalu mengikuti i'rab matbu' (kata yang diikuti) — jika matbu' manshub, tabi' pun manshub; jika majrur, tabi' pun majrur.</div>
  `,
  matan:[
    {ar:"النَّعْتُ تَابِعٌ لِلْمَنْعُوتِ فِي رَفْعِهِ، وَنَصْبِهِ، وَخَفْضِهِ، وَتَعْرِيفِهِ، وَتَنْكِيرِهِ", id:"Na't mengikuti man'ut-nya (kata yang disifati) dalam hal rafa', nashab, khafadh, ma'rifah, dan nakirahnya."},
    {ar:"وَحُرُوفُ الْعَطْفِ عَشَرَةٌ وَهِيَ: الْوَاوُ، وَالْفَاءُ، وَثُمَّ، وَأَوْ، وَأَمْ، وَإِمَّا، وَبَلْ، وَلَا، وَلَكِنْ، وَحَتَّى", id:"Huruf-huruf 'athaf ada sepuluh: wawu, fa', tsumma, au, am, imma, bal, la, lakin, dan hatta."},
    {ar:"وَالتَّوْكِيدُ تَابِعٌ لِلْمُؤَكَّدِ فِي رَفْعِهِ، وَنَصْبِهِ، وَخَفْضِهِ، وَتَعْرِيفِهِ، وَيَكُونُ بِأَلْفَاظٍ مَعْلُومَةٍ وَهِيَ: النَّفْسُ، وَالْعَيْنُ، وَكُلٌّ، وَأَجْمَعُ", id:"Taukid mengikuti mu'akkad-nya dalam rafa', nashab, khafadh, dan ma'rifahnya, dengan lafazh-lafazh tertentu: nafsu, 'ainu, kullun, dan ajma'u."},
    {ar:"إِذَا أُبْدِلَ اسْمٌ مِنِ اسْمٍ أَوْ فِعْلٌ مِنْ فِعْلٍ تَبِعَهُ فِي جَمِيعِ إِعْرَابِهِ", id:"Apabila suatu isim digantikan (badal) dari isim lain, atau fi'il dari fi'il lain, maka ia mengikuti i'rabnya secara penuh."}
  ],
  examples:[
    {label:"Na't (Sifat)", words:[
      {text:'جَاءَ', role:"Fi'il Madhi", detail:"Mabni fathah."},
      {text:'رَجُلٌ', role:"Fa'il — Man'ut", detail:"Marfu' dengan dhammah, kata yang disifati."},
      {text:'صَالِحٌ', role:"Na't", detail:"Mengikuti i'rab رَجُلٌ, sama-sama marfu' dengan dhammah."}
    ]},
    {label:"'Athaf & Badal", words:[
      {text:'زَيْدٌ', role:"Fa'il", detail:"Marfu', kata yang di-'athaf-kan/diganti."},
      {text:'وَعَمْرٌو', role:"Ma'thuf", detail:"وَ adalah huruf 'athaf, عَمْرٌو mengikuti i'rab زَيْدٌ (marfu')."},
      {text:'زَيْدٌ ', role:"Badal", detail:"Pada contoh جَاءَ أَخُوكَ زَيْدٌ, زَيْدٌ menggantikan/menjelaskan أَخُوكَ, i'rabnya mengikuti (marfu')."}
    ]}
  ],
  quiz:[
    {q:"Kata yang mengikuti i'rab kata sebelumnya secara umum disebut...", ar:"", opts:["Mudhaf","Tabi'","Munada","Mustatsna"], answer:1, explain:"Tabi' (dari tawabi') selalu mengikuti i'rab kata sebelumnya (matbu')."},
    {q:"Pada جَاءَ رَجُلٌ صَالِحٌ, kata صَالِحٌ berkedudukan sebagai...", ar:"جَاءَ رَجُلٌ صَالِحٌ", opts:["Na't","'Athaf","Taukid","Badal"], answer:0, explain:"صَالِحٌ menerangkan sifat رَجُلٌ, sehingga disebut na't."},
    {q:"Huruf وَ pada جَاءَ زَيْدٌ وَعَمْرٌو berfungsi sebagai huruf...", ar:"جَاءَ زَيْدٌ وَعَمْرٌو", opts:["Jar","'Athaf","Nida'","Syarat"], answer:1, explain:"وَ di sini adalah huruf 'athaf yang menghubungkan عَمْرٌو dengan زَيْدٌ."},
    {q:"Manakah lafazh yang biasa digunakan untuk taukid?", ar:"", opts:["إِلَّا","نَفْسُ / عَيْنُ / كُلُّ","يَا","مِنْ"], answer:1, explain:"Lafazh نَفْسُ، عَيْنُ، كُلُّ adalah lafazh-lafazh yang lazim dipakai untuk taukid (penegasan)."}
  ]
},
{
  id:'zhanna-akhawatuha', arNum:'١٤', section:'lanjutan', title:"Zhanna wa Akhawātuhā", arTitle:'ظَنَّ وَأَخَوَاتُهَا',
  content:`
  <p><b>Zhanna dan saudara-saudaranya</b> adalah kelompok fi'il ketiga (setelah Kana dan Inna) yang masuk ke susunan mubtada'-khabar. Bedanya: Kana me-rafa'-kan isim &amp; me-nashab-kan khabar, Inna me-nashab-kan isim &amp; me-rafa'-kan khabar, sedangkan Zhanna dan saudaranya me-nashab-kan <b>keduanya sekaligus</b> — mubtada' menjadi maf'ul bih pertama, dan khabar menjadi maf'ul bih kedua.</p>
  <table class="irab-table">
    <tr><th>Fi'il</th><th>Makna</th></tr>
    <tr><td class="ar">ظَنَنْتُ</td><td>aku mengira/menyangka</td></tr>
    <tr><td class="ar">حَسِبْتُ</td><td>aku mengira</td></tr>
    <tr><td class="ar">خِلْتُ</td><td>aku mengira</td></tr>
    <tr><td class="ar">زَعَمْتُ</td><td>aku mengklaim/menganggap</td></tr>
    <tr><td class="ar">رَأَيْتُ</td><td>aku berpendapat/menganggap (bukan makna melihat dengan mata)</td></tr>
    <tr><td class="ar">عَلِمْتُ</td><td>aku mengetahui/meyakini</td></tr>
    <tr><td class="ar">وَجَدْتُ</td><td>aku mendapati</td></tr>
    <tr><td class="ar">اتَّخَذْتُ</td><td>aku menjadikan</td></tr>
    <tr><td class="ar">جَعَلْتُ</td><td>aku menjadikan</td></tr>
    <tr><td class="ar">سَمِعْتُ</td><td>aku mendengar (dalam makna tertentu)</td></tr>
  </table>
  <div class="note-box"><b>Perbandingan tiga 'amil mubtada'-khabar:</b> Kana → rafa' isim, nashab khabar. Inna → nashab isim, rafa' khabar. Zhanna → nashab keduanya (maf'ul pertama &amp; kedua).</div>
  `,
  matan:[
    {ar:"وَأَمَّا ظَنَنْتُ وَأَخَوَاتُهَا فَإِنَّهَا تَنْصِبُ الْمُبْتَدَأَ وَالْخَبَرَ عَلَى أَنَّهُمَا مَفْعُولَانِ لَهَا، وَهِيَ: ظَنَنْتُ، وَحَسِبْتُ، وَخِلْتُ، وَزَعَمْتُ، وَرَأَيْتُ، وَعَلِمْتُ، وَوَجَدْتُ، وَاتَّخَذْتُ، وَجَعَلْتُ، وَسَمِعْتُ", id:"Adapun zhanantu dan saudara-saudaranya, ia me-nashab-kan mubtada' dan khabar sekaligus sebagai dua maf'ul baginya. Saudara-saudaranya adalah: zhanantu, hasibtu, khiltu, za'amtu, ra'aitu, 'alimtu, wajadtu, ittakhadztu, ja'altu, sami'tu."}
  ],
  examples:[
    {label:"Zhanna", words:[
      {text:'ظَنَنْتُ', role:"Fi'il + Fa'il", detail:"ظَنَّ mabni fathah, تُ dhamir fa'il. Fi'il ini me-nashab-kan dua maf'ul sekaligus."},
      {text:'زَيْدًا', role:"Maf'ul Bih Pertama", detail:"Asalnya mubtada', kini manshub sebagai maf'ul pertama karena masuknya ظَنَنْتُ."},
      {text:'قَائِمًا', role:"Maf'ul Bih Kedua", detail:"Asalnya khabar, kini manshub sebagai maf'ul kedua."}
    ]}
  ],
  quiz:[
    {q:"Apa perbedaan utama 'amal Zhanna dibanding Kana dan Inna?", ar:"ظَنَنْتُ زَيْدًا قَائِمًا", opts:["Zhanna hanya me-rafa'-kan","Zhanna me-nashab-kan mubtada' dan khabar sekaligus sebagai dua maf'ul","Zhanna tidak beramal apa-apa","Zhanna sama persis dengan Inna"], answer:1, explain:"Zhanna dan saudaranya me-nashab-kan KEDUA unsur (mubtada' &amp; khabar) sekaligus, berbeda dari Kana (rafa'-nashab) dan Inna (nashab-rafa')."},
    {q:"Manakah yang TERMASUK saudara Zhanna?", ar:"", opts:["أَصْبَحَ","لَعَلَّ","حَسِبْتُ","لَيْسَ"], answer:2, explain:"حَسِبْتُ (aku mengira) adalah salah satu saudara Zhanna; أَصْبَحَ dan لَيْسَ adalah saudara Kana, sedangkan لَعَلَّ adalah saudara Inna."},
    {q:"Pada رَأَيْتُ الْعِلْمَ نُورًا, kata نُورًا berkedudukan sebagai...", ar:"رَأَيْتُ الْعِلْمَ نُورًا", opts:["Khabar","Maf'ul Bih Kedua","Hal","Tamyiz"], answer:1, explain:"رَأَيْتُ di sini bermakna 'menganggap' (bukan melihat dengan mata), sehingga beramal seperti zhanna: الْعِلْمَ menjadi maf'ul pertama, نُورًا menjadi maf'ul kedua."}
  ]
}
];

/* ===================== RENDER LOGIC ===================== */
const tocList = document.getElementById('tocList');
const pageContent = document.getElementById('pageContent');
const tocProgress = document.getElementById('tocProgress');
let currentIndex = 0;
let visited = new Set();
let activeExampleIdx = 0;

function buildToc(){
  tocList.innerHTML = '';
  let lastSection = null;
  babs.forEach((b,i)=>{
    if(b.section !== lastSection){
      const label = document.createElement('div');
      label.className = 'toc-section-label';
      label.textContent = b.section === 'dasar' ? 'Bagian Dasar' : 'Bagian Lanjutan';
      tocList.appendChild(label);
      lastSection = b.section;
    }
    const btn = document.createElement('button');
    btn.className = 'toc-item';
    btn.innerHTML = `<span class="num">${b.arNum}</span><span>${b.title}</span>`;
    btn.addEventListener('click',()=>{ currentIndex=i; renderPage(); });
    tocList.appendChild(btn);
  });
  const label2 = document.createElement('div');
  label2.className = 'toc-section-label';
  label2.textContent = 'Penutup';
  tocList.appendChild(label2);
  const finalBtn = document.createElement('button');
  finalBtn.className = 'toc-item';
  finalBtn.innerHTML = `<span class="num">خ</span><span>Ujian Akhir</span>`;
  finalBtn.addEventListener('click',()=>{ currentIndex = babs.length; renderPage(); });
  tocList.appendChild(finalBtn);
}

function updateTocActive(){
  const items = tocList.querySelectorAll('.toc-item');
  items.forEach((el,i)=> el.classList.toggle('active', i===currentIndex));
}

function renderMatan(bab){
  if(bab.matan && bab.matan.length){
    const lines = bab.matan.map(m=>`
      <div class="matan-line">
        <div class="matan-ar">${m.ar}</div>
        <div class="matan-id">${m.id}</div>
      </div>`).join('');
    return `
    <div class="matan-box">
      <div class="matan-label">Teks Asli Matan Al-Ajurumiyah &amp; Terjemahnya</div>
      ${lines}
    </div>`;
  }
  if(bab.matanInfo){
    return `<div class="matan-note">${bab.matanInfo}</div>`;
  }
  return '';
}

function renderParser(bab){
  if(!bab.examples || !bab.examples.length) return '';
  const tabs = bab.examples.length > 1
    ? `<div class="example-tabs">${bab.examples.map((ex,i)=>`<button class="example-tab ${i===0?'active':''}" data-ex="${i}">${ex.label}</button>`).join('')}</div>`
    : '';
  return `
  <div class="parser-block">
    <div class="parser-label-row">
      <div class="parser-label">Papan I'rab · ${bab.examples[0].label}</div>
      ${tabs}
    </div>
    <div class="parser-sentence" id="parserSentence"></div>
    <div class="hint-tap">↳ Ketuk setiap kata untuk melihat kedudukan i'rab-nya</div>
  </div>`;
}

function renderParserWords(example){
  const container = document.getElementById('parserSentence');
  container.innerHTML = example.words.map((w,idx)=>`<span class="parser-word" data-idx="${idx}">${w.text}</span>`).join('');
  container.querySelectorAll('.parser-word').forEach(el=>{
    el.addEventListener('click',()=>{
      const idx = el.dataset.idx;
      const isOpen = el.classList.contains('open');
      container.querySelectorAll('.parser-detail').forEach(d=>d.remove());
      container.querySelectorAll('.parser-word').forEach(w=>w.classList.remove('open'));
      if(!isOpen){
        el.classList.add('open');
        const w = example.words[idx];
        const detail = document.createElement('div');
        detail.className = 'parser-detail';
        detail.innerHTML = `<div class="role">${w.role}</div><div>${w.detail}</div>`;
        el.insertAdjacentElement('afterend', detail);
      }
    });
  });
}

function attachParserEvents(bab){
  if(!bab.examples || !bab.examples.length) return;
  activeExampleIdx = 0;
  renderParserWords(bab.examples[0]);
  const tabs = document.querySelectorAll('.example-tab');
  tabs.forEach(tab=>{
    tab.addEventListener('click',()=>{
      tabs.forEach(t=>t.classList.remove('active'));
      tab.classList.add('active');
      const i = parseInt(tab.dataset.ex);
      renderParserWords(bab.examples[i]);
    });
  });
}

function renderQuiz(bab){
  if(!bab.quiz) return '';
  const items = bab.quiz.map((q,qi)=>{
    const opts = q.opts.map((o,oi)=>`<button class="q-opt" data-q="${qi}" data-o="${oi}">${o}</button>`).join('');
    const arLine = q.ar ? `<div class="q-arabic">${q.ar}</div>` : '';
    return `
    <div class="q-item" data-qidx="${qi}">
      <div class="q-text">${qi+1}. ${q.q}</div>
      ${arLine}
      <div class="q-opts">${opts}</div>
      <div class="q-explain" id="explain-${bab.id}-${qi}">${q.explain}</div>
    </div>`;
  }).join('');
  return `
  <div class="quiz-block">
    <h3>Uji Pemahaman</h3>
    <div class="quiz-sub">Pilih jawaban yang paling tepat</div>
    ${items}
  </div>`;
}

function attachQuizEvents(bab){
  if(!bab.quiz) return;
  document.querySelectorAll('.q-item').forEach(item=>{
    const qi = parseInt(item.dataset.qidx);
    const q = bab.quiz[qi];
    const opts = item.querySelectorAll('.q-opt');
    opts.forEach(opt=>{
      opt.addEventListener('click',()=>{
        if(opt.disabled) return;
        opts.forEach(o=>o.disabled=true);
        const oi = parseInt(opt.dataset.o);
        if(oi === q.answer){
          opt.classList.add('correct');
        } else {
          opt.classList.add('wrong');
          opts[q.answer].classList.add('correct');
        }
        document.getElementById(`explain-${bab.id}-${qi}`).classList.add('show');
      });
    });
  });
}

function renderPage(){
  if(currentIndex >= babs.length){
    renderFinalExam();
    updateTocActive();
    window.scrollTo({top:0,behavior:'smooth'});
    return;
  }
  const bab = babs[currentIndex];
  visited.add(bab.id);

  pageContent.innerHTML = `
    <div class="bab-eyebrow">Bab ${currentIndex+1} dari ${babs.length} · ${bab.section === 'dasar' ? 'Bagian Dasar' : 'Bagian Lanjutan'}</div>
    <div class="bab-title-row">
      <span class="bab-num-big">${bab.arNum}</span>
      <h2 class="bab-title">${bab.title}</h2>
    </div>
    <div class="bab-arabic-title">${bab.arTitle}</div>
    <hr class="divider">
    ${bab.content}
    ${renderMatan(bab)}
    ${renderParser(bab)}
    ${renderQuiz(bab)}
    <div class="page-nav">
      <button class="nav-btn" id="prevBtn" ${currentIndex===0?'disabled':''}>← Bab Sebelumnya</button>
      <button class="nav-btn" id="nextBtn">${currentIndex===babs.length-1?'Menuju Ujian Akhir →':'Bab Selanjutnya →'}</button>
    </div>
  `;
  attachParserEvents(bab);
  attachQuizEvents(bab);
  document.getElementById('prevBtn').addEventListener('click',()=>{ if(currentIndex>0){currentIndex--; renderPage();} });
  document.getElementById('nextBtn').addEventListener('click',()=>{ currentIndex++; renderPage(); });
  updateTocActive();
  tocProgress.textContent = `Dipelajari: ${visited.size}/${babs.length} bab`;
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ===================== FINAL EXAM ===================== */
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function renderFinalExam(){
  const allQ = [];
  babs.forEach(b=>{ (b.quiz||[]).forEach(q=> allQ.push({...q, babTitle:b.title})); });
  const examQ = shuffle(allQ).slice(0,12);

  const items = examQ.map((q,qi)=>{
    const opts = q.opts.map((o,oi)=>`<button class="q-opt" data-q="${qi}" data-o="${oi}">${o}</button>`).join('');
    const arLine = q.ar ? `<div class="q-arabic">${q.ar}</div>` : '';
    return `
    <div class="q-item" data-qidx="${qi}">
      <div class="q-text">${qi+1}. ${q.q} <span style="font-family:var(--font-mono);font-size:10.5px;opacity:.6;">(${q.babTitle})</span></div>
      ${arLine}
      <div class="q-opts">${opts}</div>
      <div class="q-explain" id="fexplain-${qi}">${q.explain}</div>
    </div>`;
  }).join('');

  pageContent.innerHTML = `
    <div class="bab-eyebrow">Penutup</div>
    <div class="bab-title-row">
      <span class="bab-num-big">خ</span>
      <h2 class="bab-title">Ujian Akhir</h2>
    </div>
    <div class="bab-arabic-title">خَاتِمَةُ الدَّرْسِ</div>
    <hr class="divider">
    <p>Dua belas soal acak dari seluruh bab (dasar dan lanjutan) yang telah dipelajari. Ujian ini menguji pemahaman menyeluruh terhadap Matan Al-Ajurumiyah.</p>
    <div id="scoreArea"></div>
    <div class="quiz-block" style="border-top:none;padding-top:0;">
      ${items}
    </div>
    <div class="page-nav">
      <button class="nav-btn" id="prevBtn">← Kembali ke Bab Terakhir</button>
      <button class="nav-btn" id="finishBtn">Hitung Nilai</button>
    </div>
  `;

  let answered = 0, correct = 0;
  document.querySelectorAll('.q-item').forEach(item=>{
    const qi = parseInt(item.dataset.qidx);
    const q = examQ[qi];
    const opts = item.querySelectorAll('.q-opt');
    opts.forEach(opt=>{
      opt.addEventListener('click',()=>{
        if(opt.disabled) return;
        opts.forEach(o=>o.disabled=true);
        answered++;
        const oi = parseInt(opt.dataset.o);
        if(oi === q.answer){
          opt.classList.add('correct');
          correct++;
        } else {
          opt.classList.add('wrong');
          opts[q.answer].classList.add('correct');
        }
        document.getElementById(`fexplain-${qi}`).classList.add('show');
      });
    });
  });

  document.getElementById('prevBtn').addEventListener('click',()=>{ currentIndex = babs.length-1; renderPage(); });
  document.getElementById('finishBtn').addEventListener('click',()=>{
    const scoreArea = document.getElementById('scoreArea');
    scoreArea.innerHTML = `<div class="score-badge">Nilai: ${correct} / ${examQ.length} (${answered} soal terjawab)</div>`;
  });
}

/* ===================== MOBILE TOC TOGGLE ===================== */
document.getElementById('tocToggle').addEventListener('click',()=>{
  const toc = document.getElementById('toc');
  toc.classList.toggle('collapsed');
  document.getElementById('tocToggleIcon').textContent = toc.classList.contains('collapsed') ? '▸' : '▾';
});

/* init */
buildToc();
renderPage();
if(window.innerWidth <= 860){
  document.getElementById('toc').classList.add('collapsed');
  document.getElementById('tocToggleIcon').textContent = '▸';
}
</script>
</body>
</html>
