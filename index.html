<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kitab Klasik · macOS Golden Gate</title>
<style>
:root{--or:#e8541e;--gl:rgba(255,255,255,.14);--bd:rgba(255,255,255,.3);--sh:0 24px 70px rgba(10,5,30,.5)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;color:#fff;-webkit-user-select:none;user-select:none}
body{background:linear-gradient(180deg,#1b1646 0%,#5a2f7a 32%,#d9567a 58%,#ff9a56 76%,#ffc98a 88%,#5b7f9e 100%)}
body.drag iframe{pointer-events:none}
#bg{position:fixed;inset:0;z-index:0;overflow:hidden}
#bg svg{position:absolute;bottom:0;left:0;width:100%;height:58%}
.fog{position:absolute;left:-10%;width:120%;height:22%;background:radial-gradient(ellipse at 50% 50%,rgba(255,255,255,.5),transparent 70%);filter:blur(24px);animation:fg 22s ease-in-out infinite alternate}
.f1{bottom:22%}.f2{bottom:8%;animation-duration:30s;opacity:.7}
@keyframes fg{to{transform:translateX(7%)}}
#menu{position:fixed;z-index:1000;top:0;left:0;right:0;height:30px;display:flex;align-items:center;gap:18px;padding:0 14px;background:rgba(20,10,40,.32);backdrop-filter:blur(30px) saturate(170%);-webkit-backdrop-filter:blur(30px) saturate(170%);font-size:13px;white-space:nowrap}
#menu b{font-weight:700}#menu .r{margin-left:auto;display:flex;gap:14px}#menu .m{opacity:.9}
#lp{position:fixed;z-index:5;inset:30px 0 96px;display:flex;flex-direction:column;align-items:center;padding:20px 16px 0;transition:opacity .3s,transform .3s}
body.nolp #lp{opacity:0;transform:scale(1.06);pointer-events:none}
#lpHead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;margin-bottom:18px}
.sq{background:var(--gl);border:1px solid var(--bd);border-radius:10px;padding:7px 12px;color:#fff;font-size:13px;outline:0;width:240px;-webkit-user-select:text;user-select:text}
.sq::placeholder{color:#fffa}
.chip{border:1px solid var(--bd);background:var(--gl);color:#fff;border-radius:999px;padding:6px 13px;font-size:12px;cursor:pointer}
.chip.on{background:var(--or);border-color:#ffb08a}
#grid,.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:14px 6px;width:min(1120px,100%);overflow:auto;padding:6px 6px 24px;align-content:start;scrollbar-width:none}
#grid{flex:1}
.app{background:none;border:0;color:#fff;font:inherit;text-align:center;cursor:pointer;padding:6px 2px;border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:7px;-webkit-tap-highlight-color:transparent}
.app:hover,.app:focus-visible{background:rgba(255,255,255,.14);outline:0}
.app:hover .ic{transform:scale(1.1) translateY(-3px)}
.app>span{font-size:12px;line-height:1.2;max-width:96px;text-shadow:0 1px 4px #0008;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ic{width:66px;height:66px;border-radius:16px;display:grid;place-items:center;align-content:center;font-weight:700;font-size:23px;letter-spacing:.02em;background:linear-gradient(150deg,var(--a),var(--b));border:1px solid rgba(255,255,255,.4);box-shadow:0 10px 22px #0005,inset 0 1px 0 #fff7,inset 0 -8px 14px #0003;transition:transform .18s cubic-bezier(.3,1.6,.5,1);position:relative}
.ic small{font-size:8px;font-weight:700;letter-spacing:.08em;opacity:.9;margin-top:-1px}
.ic:before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.32),transparent 45%)}
.ic.sm{width:48px;height:48px;border-radius:12px;font-size:18px}
.ic.fold{--a:#7fc6ff;--b:#2f7fd8;font-size:30px}
#peek{position:fixed;z-index:1100;width:310px;padding:15px 16px 13px;border-radius:18px;background:rgba(28,18,48,.62);backdrop-filter:blur(34px) saturate(180%);-webkit-backdrop-filter:blur(34px) saturate(180%);border:1px solid var(--bd);box-shadow:var(--sh),inset 0 1px 0 #fff3;pointer-events:none;opacity:0;transform:scale(.88) translateY(6px);transition:opacity .12s,transform .16s cubic-bezier(.3,1.5,.5,1);-webkit-user-select:none}
#peek.on{opacity:1;transform:none}
#peek .t{font-size:16px;font-weight:700;margin:6px 0 2px}#peek .s{font-size:11px;opacity:.7;margin-bottom:8px}
#peek p{margin:0;font-size:12.5px;line-height:1.5;opacity:.95}
#peek .f{margin-top:10px;padding-top:8px;border-top:1px solid #fff2;font-size:11px;opacity:.7;display:flex;justify-content:space-between}
#peek .bd{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.08em;padding:3px 9px;border-radius:999px;background:var(--or)}
#dsk{position:fixed;z-index:6;top:44px;right:14px;display:flex;flex-direction:column;gap:14px}
#dock{position:fixed;z-index:900;bottom:10px;left:50%;transform:translateX(-50%);display:flex;align-items:flex-end;gap:10px;padding:8px 12px;border-radius:26px;background:rgba(255,255,255,.2);border:1px solid var(--bd);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);box-shadow:0 14px 40px #0005,inset 0 1px 0 #fff5;max-width:96vw}
.dk{width:56px;height:56px;border-radius:14px;display:grid;place-items:center;font-size:27px;cursor:pointer;border:1px solid #fff5;transition:transform .18s cubic-bezier(.3,1.6,.5,1);position:relative;background:linear-gradient(150deg,var(--a),var(--b));box-shadow:0 8px 18px #0004,inset 0 1px 0 #fff6}
.dk:hover{transform:scale(1.28) translateY(-8px)}.dk.run:after{content:"";position:absolute;bottom:-7px;width:4px;height:4px;border-radius:50%;background:#fff}
.dk.mn{width:44px;height:44px;font-size:14px;font-weight:700}
.sep{width:1px;height:46px;background:#fff4;align-self:center}
#wins{position:fixed;inset:0;z-index:20;pointer-events:none}
.win{position:absolute;pointer-events:auto;display:flex;flex-direction:column;border-radius:14px;overflow:hidden;background:rgba(32,24,52,.72);backdrop-filter:blur(30px) saturate(160%);-webkit-backdrop-filter:blur(30px) saturate(160%);border:1px solid var(--bd);box-shadow:var(--sh);animation:pop .22s cubic-bezier(.3,1.4,.5,1);resize:both;min-width:300px;min-height:220px;transition:opacity .22s,transform .22s}
@keyframes pop{from{opacity:0;transform:scale(.92)}}
.win.max{left:0!important;top:30px!important;width:100%!important;height:calc(100% - 30px)!important;border-radius:0;resize:none}
.win.hid{opacity:0;transform:translateY(40%) scale(.4);pointer-events:none}
.tb{height:40px;display:flex;align-items:center;gap:8px;padding:0 12px;background:rgba(255,255,255,.08);border-bottom:1px solid #fff2;cursor:grab;touch-action:none;flex:none}
.tl{display:flex;gap:8px}.tl i{width:13px;height:13px;border-radius:50%;cursor:pointer;display:block}
.tl i:nth-child(1){background:#ff5f57}.tl i:nth-child(2){background:#febc2e}.tl i:nth-child(3){background:#28c840}
.tb .tt{flex:1;text-align:center;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb a{color:#fff;text-decoration:none;font-size:15px;opacity:.8}
.bd2{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
.bd2 iframe{flex:1;border:0;background:#fff;width:100%}
.fb{display:flex;flex:1;min-height:0}
.sb{width:170px;flex:none;padding:12px 8px;background:rgba(255,255,255,.06);border-right:1px solid #fff2;font-size:13px}
.sb h6{margin:4px 8px 6px;font-size:10.5px;opacity:.55;letter-spacing:.08em}
.sb div.it{padding:7px 10px;border-radius:8px;cursor:pointer;display:flex;gap:8px}
.sb div.it.on{background:rgba(255,255,255,.2)}
.fm{flex:1;display:flex;flex-direction:column;min-width:0}
.tool{display:flex;gap:8px;padding:10px 12px;flex-wrap:wrap;align-items:center;border-bottom:1px solid #fff2}
.tool .sq{width:170px;padding:6px 10px}
.btn{border:1px solid var(--bd);background:var(--gl);color:#fff;border-radius:8px;padding:6px 11px;font-size:12px;cursor:pointer}.btn:hover{background:rgba(255,255,255,.26)}
.fgrid{width:100%;flex:1;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));padding:14px}
.file{text-align:center;padding:8px 4px;border-radius:10px;cursor:pointer;font-size:11.5px;line-height:1.25}
.file.sel{background:rgba(232,84,30,.5)}.file span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.file small{display:block;opacity:.6;margin-top:2px}
.pdf{width:52px;height:66px;margin:0 auto 6px;background:#fff;border-radius:5px 12px 5px 5px;position:relative;box-shadow:0 6px 14px #0005;color:#d32f2f;font-weight:800;font-size:12px;display:grid;place-items:end center;padding-bottom:9px}
.pdf:before{content:"";position:absolute;top:0;right:0;border-style:solid;border-width:0 14px 14px 0;border-color:transparent #ddd transparent transparent}
.pdf:after{content:"";position:absolute;left:9px;right:9px;top:20px;height:18px;background:repeating-linear-gradient(#cfd2d8 0 2px,transparent 2px 6px)}
.st{padding:7px 14px;font-size:11.5px;opacity:.7;border-top:1px solid #fff2}
.emp{margin:auto;opacity:.65;font-size:13px;text-align:center;padding:30px}
@media(max-width:700px){.sb{display:none}#dsk{display:none}.ic{width:58px;height:58px;font-size:20px}#grid{grid-template-columns:repeat(auto-fill,minmax(82px,1fr))}.dk{width:46px;height:46px}}
/* v2 liquid glass */
body{color:#2a2230;background:#b9a98f}
#bg svg{position:absolute;inset:0;width:100%;height:100%;bottom:auto}
#menu{color:#2a2230;background:rgba(255,255,255,.32);backdrop-filter:blur(36px) saturate(190%);-webkit-backdrop-filter:blur(36px) saturate(190%);box-shadow:inset 0 -1px 0 rgba(255,255,255,.6),0 1px 14px rgba(60,40,70,.12)}
#lp,.win,#peek{color:#fff}
#lp{inset:0;z-index:800;padding:62px 16px 118px;background:radial-gradient(120% 70% at 50% 0,rgba(255,255,255,.2),transparent 60%),rgba(48,38,62,.44);backdrop-filter:blur(48px) saturate(180%);-webkit-backdrop-filter:blur(48px) saturate(180%)}
#dock,.wg{background:linear-gradient(145deg,rgba(255,255,255,.5),rgba(255,255,255,.14) 55%,rgba(255,255,255,.32));border:1px solid rgba(255,255,255,.65);backdrop-filter:blur(34px) saturate(210%) brightness(1.08);-webkit-backdrop-filter:blur(34px) saturate(210%) brightness(1.08);box-shadow:0 22px 50px rgba(70,50,80,.3),inset 0 2px 1px rgba(255,255,255,.95),inset 0 -2px 2px rgba(255,255,255,.45),inset 0 0 26px rgba(255,255,255,.22)}
.win,#peek{background:linear-gradient(145deg,rgba(84,68,112,.55),rgba(36,28,58,.48));border:1px solid rgba(255,255,255,.5);backdrop-filter:blur(42px) saturate(210%) brightness(1.05);-webkit-backdrop-filter:blur(42px) saturate(210%) brightness(1.05);box-shadow:0 28px 70px rgba(30,20,50,.45),inset 0 2px 1px rgba(255,255,255,.7),inset 0 -2px 2px rgba(255,255,255,.2),inset 0 0 28px rgba(255,255,255,.08)}
#dock:before,.wg:before,#peek:before{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(130% 70% at 15% -10%,rgba(255,255,255,.55),transparent 55%),linear-gradient(200deg,transparent 60%,rgba(255,255,255,.25));pointer-events:none}
#peek:before{opacity:.3}.wg>*{position:relative}
#dsk{left:18px;right:auto;top:46px}
#dsk .app{color:#2b2233;text-shadow:0 1px 3px rgba(255,255,255,.8)}#dsk .app:hover{background:rgba(255,255,255,.32)}
#wgs{position:fixed;z-index:6;top:46px;right:18px;display:flex;gap:14px}
.wg{position:relative;overflow:hidden;width:158px;height:158px;border-radius:32px;color:#1d1a22}
.wg.clk svg{width:100%;height:100%;padding:6px}#hH,#hM,#hS{filter:drop-shadow(0 1.5px 1.2px rgba(0,0,0,.3))}
.wg.dt{padding:15px 17px;display:flex;flex-direction:column}
.dt .d1{color:#ff3b30;font-weight:700;font-size:13px;letter-spacing:.07em;text-transform:uppercase}.dt .d2{font-size:74px;font-weight:300;line-height:1;margin-top:2px;letter-spacing:-.04em}
.dt .d3{margin-top:auto;font-size:13px;font-weight:600;color:#352f3d}.dt .d4{font-size:11px;opacity:.6}
.ic{font-size:34px}.ic b{font-weight:400;font-size:35px;line-height:1;position:relative;z-index:1;filter:drop-shadow(0 3px 3px rgba(0,0,0,.35))}
.ic:after{content:"";position:absolute;inset:1px;border-radius:inherit;box-shadow:inset 0 2px 2px rgba(255,255,255,.75),inset 0 -3px 6px rgba(0,0,0,.2);pointer-events:none}
.dk{font-size:29px}
@media(max-width:700px){#wgs{transform:scale(.72);transform-origin:top right;right:8px}.ic b{font-size:30px}}
#wgs,#dsk{transition:opacity .3s}body:not(.nolp) #wgs,body:not(.nolp) #dsk{opacity:0;pointer-events:none}
#peek{background:linear-gradient(145deg,rgba(62,48,90,.86),rgba(28,20,46,.84))}
.wg.clk{padding:15px 17px;display:flex;flex-direction:column}.clk .d1{font-weight:700;font-size:13px;letter-spacing:.07em;text-transform:uppercase}.clk .d4{font-size:11px;opacity:.6}
.tm{font-size:42px;font-weight:300;letter-spacing:-.03em;line-height:1;margin-top:8px;font-variant-numeric:tabular-nums;display:flex;align-items:center}
.tm i{font-style:normal;opacity:.55;margin:0 1px;position:relative;top:-3px;animation:bk 1s steps(1) infinite}@keyframes bk{50%{opacity:.1}}
.ts{margin-top:auto;font-size:13px;font-weight:600;color:#352f3d}.ts b{color:#ff9500;font-size:24px;font-weight:500;font-variant-numeric:tabular-nums;margin-right:2px}
.file .th{position:relative;width:78px;height:100px;margin:0 auto 6px;border-radius:8px;overflow:hidden;background:#fff;box-shadow:0 6px 14px #0005}
.file .th .pdf{width:100%;height:100%;margin:0;border-radius:0;box-shadow:none}.file .th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top center;background:#fff}

 if(W[id]){show(W[id]);return W[id]}

async function loadDrive(){const k='kitab_gg_pdf';try{const c=JSON.parse(sessionStorage.getItem(k)||'null');c&&c.forEach(addDrive)}catch(e){}drawF();
 try{const u=new URL(PDFURL);u.searchParams.set('action','listAny');u.searchParams.set('folderId',PDFID);const r=await(await fetch(u)).json();
  if(r&&r.ok){const f=(r.files||[]).filter(f=>f.kind!=='folder'&&(/pdf/i.test(f.mimeType||'')||/\.pdf$/i.test(f.name||'')));try{sessionStorage.setItem(k,JSON.stringify(f.map(a=>({id:a.id,name:a.name,size:a.size,thumbnailLink:a.thumbnailLink||''}))))}catch(e){}

function addDrive(f){if(pdfs.some(p=>p.id=='d'+f.id))return;pdfs.push({id:'d'+f.id,name:f.name||'PDF',size:+f.size||0,drive:f.id,thumb:f.thumbnailLink||'https://drive.google.com/thumbnail?id='+encodeURIComponent(f.id)+'&sz=w320'})}
